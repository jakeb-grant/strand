name: Strand job setup
description: >
  The machine every CI job of .github/workflows/ci.yml starts from: room on
  the disk, the CI image (or, for the one job outside it, the build headers
  on the runner), the toolchain rust-cache keys on and a dependency cache.
inputs:
  tier:
    description: >
      "image": the job's commands run through scripts/container/run.sh, in
      the CI image the laptop runs; its dependency cache is target/container.
      "headers": `wasm`, the one job that builds on the runner, with its build
      headers from apt, and rustfmt and clippy.
    default: image
  free-disk:
    description: >
      Removes the image's unused SDKs first ("true" or "false"). Off: the
      runner's disk has room for every job, and the removal cost 1-2 min a
      job (decisions.md audit-free-disk). Kept for a runner with less disk.
    default: "false"
  cache-key:
    description: >
      Swatinem/rust-cache's shared-key; empty keeps its default (one cache
      per job).
    default: ""
  cache-save:
    description: Whether this job saves the cache ("true" or "false").
    default: "true"
runs:
  using: composite
  steps:
    # The SDKs we never use, removed only when a job asks for the room.
    - name: Free disk space
      if: inputs.free-disk == 'true'
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
    # The room the debug and release builds start from, logged; a warning
    # when it falls under 40 GB, the sign to turn free-disk on again.
    - name: Disk space
      shell: bash
      run: |
        df -h /
        avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
        if [ "${avail:-0}" -lt 40 ]; then
          echo "::warning::${avail}G free on /, under the 40G the builds were sized for; set free-disk: \"true\""
        fi
    # smithay-client-toolkit's build script finds xkbcommon through
    # pkg-config; wayland-sys and fontconfig link their system libraries;
    # pipewire-rs needs its headers and libclang (bindgen); strand-auth's
    # PAM helper links libpam.
    - name: Install the build headers
      if: inputs.tier == 'headers'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev \
          libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev libpam0g-dev
    # The published image, pulled here so the steps below don't hide its
    # time (scripts/container/image.sh; a fork's new Dockerfile is built).
    - name: The CI image
      if: inputs.tier == 'image'
      shell: bash
      run: scripts/container/image.sh
    # The versions the references depend on, to trace a mismatch.
    - name: Services tier tools
      if: inputs.tier == 'image'
      shell: bash
      run: scripts/container/run.sh scripts/container/machine.sh services
    - name: GPU tier device (lavapipe)
      if: inputs.tier == 'image'
      shell: bash
      run: scripts/container/run.sh scripts/container/machine.sh gpu
    - name: Reference package versions
      if: inputs.tier == 'image'
      shell: bash
      run: scripts/container/run.sh scripts/container/machine.sh references
    # Pinned to the image's toolchain so a new stable release's lints and
    # deprecations cannot fail -D warnings on unchanged code. In the
    # image's jobs nothing compiles with it: rust-cache runs rustc and cargo
    # on the runner, for its key and for what it cleans.
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.97.0
        components: ${{ inputs.tier == 'headers' && 'rustfmt, clippy' || '' }}
    # The image's hash goes into the key's env hash: cargo's fingerprint
    # doesn't cover the C compiler or the system headers, so without it a new
    # image would keep the old one's C objects and bindgen output in the gates
    # and the archive until a manifest changed (decisions.md ci-speed-2).
    - uses: Swatinem/rust-cache@v2
      env:
        STRAND_CI_IMAGE: ${{ inputs.tier == 'image' && hashFiles('scripts/container/Dockerfile') || '' }}
      with:
        shared-key: ${{ inputs.cache-key }}
        env-vars: STRAND_CI_IMAGE
        workspaces: ${{ inputs.tier == 'image' && '. -> target/container' || '. -> target' }}
        save-if: ${{ inputs.cache-save }}
