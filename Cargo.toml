[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# material-colors 0.5 (strand-theme) needs Rust 1.97; CI pins 1.97.0.
rust-version = "1.97"
repository = "https://github.com/jakeb-grant/strand"
publish = false

[workspace.dependencies]
strand-auth = { path = "crates/strand-auth" }
# `strand`'s feature `gpu` (on by default) turns on render's `gpu`,
# surface's `gpu` and the compiler's `shaders`; members get none of them
# from here, so `strand --no-default-features` links no wgpu, vello_gpu,
# naga or libwayland-client (docs/architecture.md, "Crate graph").
strand-compiler = { path = "crates/strand-compiler", default-features = false }
strand-core = { path = "crates/strand-core" }
strand-gpu = { path = "crates/strand-gpu" }
strand-icons = { path = "crates/strand-icons" }
strand-introspect = { path = "crates/strand-introspect" }
strand-render = { path = "crates/strand-render", default-features = false }
strand-scene = { path = "crates/strand-scene" }
strand-services = { path = "crates/strand-services" }
strand-services-macros = { path = "crates/strand-services-macros" }
strand-services-schema = { path = "crates/strand-services-schema" }
strand-surface = { path = "crates/strand-surface", default-features = false }
strand-text = { path = "crates/strand-text" }
strand-theme = { path = "crates/strand-theme" }
strand-watch = { path = "crates/strand-watch" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Builds without debug info: the dev container's disk is small and every
# agent and CI must build with the same settings, or cargo keeps a second
# copy of each crate per setting (docs/decisions.md, wave3-cleanup).
[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
# Fat LTO: the whole program optimised once more at link time. Chosen
# for size (decisions.md, m4-integration-w2), and as fast as thin LTO or
# faster. That last pass runs in the session of the crate that links the
# binary, `strand`, at `strand`'s opt-level, for every crate in it:
# `strand` is at 3 so the link-time inliner and vectoriser treat
# render, text, layout and their dependencies at O3 (decisions.md,
# m5-speed-strand: at 3 list scrolling, the launcher's animation, SVG
# and Lottie frames take 19-26% less time than at "s").
lto = "fat"
codegen-units = 1

# Speed first where a person feels it (the owner's policy of
# 2026-10-10): the binary crate, the render path's dependencies, Wayland
# protocol dispatch, image, SVG and Lottie decoding and the theme's
# palette solve are at the release default, 3. Only code no one waits on,
# or measured no faster at 3, is built for size here: D-Bus (zbus), the
# services runtime and its glue (strand-services, tokio, swayipc),
# introspection, settings files (toml: a 1 KB file parses in 13 us),
# diagnostics (miette), `.desktop` parsing, PipeWire's FFI wrappers, the
# clock's formatting, font enumeration, calloop's wakes and keysym names
# (decisions.md, m5-speed-profile, which gives each crate's measured
# speed and size; wave4-exitMemory for the original choice).

[profile.release.package.strand-services]
opt-level = "z"

[profile.release.package.zbus]
opt-level = "z"

[profile.release.package.zvariant]
opt-level = "z"

[profile.release.package.zbus_names]
opt-level = "z"

[profile.release.package.tokio]
opt-level = "z"

[profile.release.package.swayipc-types]
opt-level = "z"

[profile.release.package.logind-zbus]
opt-level = "z"

[profile.release.package.strand-icons]
opt-level = "s"

[profile.release.package.strand-introspect]
opt-level = "z"

[profile.release.package.toml_edit]
opt-level = "s"

[profile.release.package.toml_parser]
opt-level = "s"

# Startup and a font change only: opt 3 measured no faster (decisions.md,
# m5-speed-profile).
[profile.release.package.fontique]
opt-level = "s"

# Only wayland-scanner (a build-time macro) uses it.
[profile.release.package.quick-xml]
opt-level = "s"

# A channel wake and a key's name measured the same at 3 (decisions.md,
# m5-speed-input).
[profile.release.package.calloop]
opt-level = "s"

[profile.release.package.xkeysym]
opt-level = "s"

[profile.release.package.miette]
opt-level = "z"

[profile.release.package.chrono]
opt-level = "s"

[profile.release.package.freedesktop-desktop-entry]
opt-level = "z"

[profile.release.package.pipewire]
opt-level = "z"

[profile.release.package.libspa]
opt-level = "z"

# resvg, tiny-skia and tiny-skia-path, usvg and the rest of the SVG
# parse (svgtypes, simplecss, data-url, roxmltree), velato, serde_json,
# the image decoders, wayland-client, wayland-backend,
# smithay-client-toolkit and material-colors are at
# the release default (opt 3): each is on a path a person waits on
# (decisions.md, m5-size reclaim 2 withdrawn; m5-speed-profile).

# The timing gates' build (CI's `timing` job: theme_swap_bench and the
# reload latency bench): the release profile, its per-package opt-levels
# above and its single codegen unit included (a custom profile inherits
# them), without the cross-crate link-time optimisation that makes a
# release build slow. The memory gates (demo, services, budgets) and
# the acceptance tests keep `release` (docs/decisions.md, laptop-ci).
# Without LTO it cannot see the link-time pass's opt-level; strand's
# `speed-bench` feature runs the render benches in the shipped binary's
# LTO session (crates/strand/src/speed.rs; decisions.md, m5-speed-profile).
[profile.timing]
inherits = "release"
lto = false
