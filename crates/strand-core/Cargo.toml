[package]
name = "strand-core"
description = "Reactive core: signals, state, handlers and timers on the logic thread"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
foldhash = "0.2.0"
toml_edit = "0.25.15"
slotmap = "1.1.1"
# The IPC protocol's JSON-line codec (`ipc`; already in the graph through
# strand-services and the binary).
serde_json = "1.0.151"

# (wasm-spike) A browser's clock for `Instant` and the wall time
# (src/time.rs; docs/live-examples.md).
[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1.0"

[dev-dependencies]
proptest = "1.11.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "graph"
harness = false

[[bench]]
name = "keyed"
harness = false

[[bench]]
name = "persist"
harness = false

[lints]
workspace = true
