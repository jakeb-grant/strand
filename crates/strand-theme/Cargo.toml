[package]
name = "strand-theme"
description = "Palettes: the Material 3 role schema, material(seed:/image:), importers, gamut mapping and the contrast guard"
version.workspace = true
edition.workspace = true
# material-colors 0.5 needs Rust 1.97.
rust-version = "1.97"
repository.workspace = true
publish.workspace = true

[dependencies]
strand-scene.workspace = true
blake3 = "1.8.7"
# The Material 3 algorithm (HCT, dynamic schemes, Celebi quantiser).
material-colors = { version = "0.5.0", features = ["quantize"] }
# Wallpaper decoding for `material(image:)`.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = "1.0.151"
log = "0.4"

[dev-dependencies]
proptest = "1.11.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[lints]
workspace = true
