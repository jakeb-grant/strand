[package]
name = "strand-dev"
description = "Developer tooling: LSP and inspector, kept out of the runtime binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `shaders`: the LSP checks `.wgsl` files too.
strand-compiler = { workspace = true, features = ["shaders"] }
# The services' schemas (not their runtime): `strand-dev lsp` checks,
# hovers and completes against the services `strand run` serves.
strand-services-schema.workspace = true
# `from dbus` services checked against D-Bus introspection (zbus alone,
# not the services runtime: decisions.md, wave4-a3).
strand-introspect.workspace = true
crossbeam-channel = "0.5.17"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = "1.0.151"

[lints]
workspace = true
