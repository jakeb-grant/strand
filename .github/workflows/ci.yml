name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The Wayland and budget tiers fail instead of skipping when sway is missing.
  STRAND_REQUIRE_SWAY: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install headless sway, grim, fonts and fontconfig headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sway grim fonts-dejavu-core pkg-config libfontconfig1-dev
      # Pinned to the dev container's toolchain so a new stable release's
      # lints and deprecations cannot fail -D warnings on unchanged code.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # The 34 MB PSS gate is checked on a release build (design.md, "Testing": budgets).
      - run: cargo test --release -p strand --test demo
      # Save → pixels p95 within design.md's 35 ms (token) and 50 ms
      # (markup) on an optimised build; ignored in debug builds.
      - run: cargo test --release -p strand --bin strand reload_latency
