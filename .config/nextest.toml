# How `cargo nextest run` runs the debug workspace tests: CI's `test` job and
# `scripts/container/run.sh ci` with `--profile ci`, `run.sh affected` and a
# single test with the default profile (docs/development.md; decisions.md
# robustness has the table of what each file's lock became and the
# measurements behind these numbers). Each test runs in a process of its own,
# so a static Mutex keeps nothing apart here: what only guards the process's
# own state needs nothing, and what guards something outside it is a test group
# below. scripts/container/nextest-filters.sh fails on a filter that matches no
# test, and on a retry that reaches a test that may not have one.

[store]
# Beside target/container, so that the runner's dependency cache leaves it out.
dir = "target/nextest"

[test-groups]
# One at a time, as `SERIAL` keeps them under `cargo test`: the memory and
# idle windows of the shells these tests boot, measured without another of
# them changing what the shared libraries' pages cost.
budgets = { max-threads = 1 }

[profile.default]
fail-fast = false
status-level = "leak"
final-status-level = "flaky"
failure-output = "immediate"
# 60 s marks a test slow; 40 of them end it with a TIMEOUT that names it. A test
# had only the job's bound (60 min, less the setup and the build before it, and
# no name in the message) under `cargo test`; the longest takes under 4 min.
slow-timeout = { period = "60s", terminate-after = 40, grace-period = "30s" }

[[profile.default.overrides]]
filter = "binary_id(=strand::budgets)"
test-group = "budgets"

# A shell, its sway and grim's shots at once, each test: two slots, so what runs
# beside one leaves it room. At -j 8 on a runner, the launcher's 1,000 wheel
# notches back to the top stopped five rows short (decisions.md robustness).
[[profile.default.overrides]]
filter = "binary_id(=strand::demo)"
threads-required = 2

[profile.ci]
# The junit file scripts/container/nextest-summary.sh reads for the job summary.
junit = { path = "junit.xml", store-success-output = false, store-failure-output = true }
retries = 0

# One more try for what talks to a real sway, a private bus or a stand-in for
# either on a socket, whose failures under a loaded runner come from the daemons'
# timing. A test that passes only on the second try is reported as flaky: in the
# run's summary lines and the job summary. Never a budget, a timing gate, a wake
# or idle count, a count of work done unread, a pixel reference or logic: the
# binaries are named one by one, so a new one starts with none, and the retry is
# per test, so what a named binary holds of those is named below it.
# nextest-filters.sh reads each retried binary's source, with the modules it
# includes, and fails on a `Gates` or a count of that kind left in, by the words
# of its message. The nightly job doesn't use nextest at all.
#
# 15 minutes, not the 40 above: twice that still ends inside the job's 60, so
# what hangs is named before the job is killed and its summary lost.
[[profile.ci.overrides]]
filter = '''
(binary_id(/^strand-services::(battery|bluetooth|brightness|builtin|clipboard|custom|media|network|network_iwd|notifications|outputs|polkit|screen|session|sway|tray|wm_services)$/)
 | binary_id(/^strand-introspect::connection$/)
 | binary_id(/^strand-watch::portal$/)
 | binary_id(/^strand-surface::(clipboard|compose|dnd|sway|window)$/)
 | binary_id(/^strand::(clipboard|dbus_shells|kept_sizes|screens_focus|tray_menu|wm_audio_shells)$/))
 & not (test(=a_frozen_player_does_not_hold_up_the_others)
  | test(=another_notification_server_fails_clearly)
  | test(=a_frozen_app_does_not_hold_up_the_tray)
  | test(=a_hanging_read_does_not_hold_the_boot_batch)
  | test(=idle_requests_no_frames_and_commits_nothing)
  | test(=the_compositor_stores_follow_sway_through_one_hub)
  | test(=a_fast_listen_command_wakes_the_logic_thread_once_a_frame)
  | test(=system_reads_the_kernel_and_counts_uptime_by_the_minute)
  | test(=a_heard_listen_command_sends_every_line)
  | test(=a_dir_is_listed_and_followed)
  | test(=a_file_rewritten_in_place_never_shows_it_empty)
  | test(=a_huge_dir_lists_its_first_files_by_name)
  | test(=a_busy_dir_is_listed_at_most_every_relist)
  | test(=without_a_bus_system_keeps_its_seeded_values)
  | test(=cpu_and_memory_sample_only_while_a_reader_is_visible)
  | test(=disk_reads_the_root_filesystem_only_while_visible)
  | test(=network_rates_count_the_hardware_only_while_read)
  | test(=without_a_compositor_outputs_is_unavailable_and_fails_as_events)
  | test(=a_question_that_times_out_does_not_wait_for_another_callers_connect)
  | test(=commits_lock_to_the_refresh_rate)
  | test(=media_follows_the_active_player_without_polling)
  | test(=network_follows_iwd_where_networkmanager_is_absent)
  | test(=network_follows_networkmanager_and_scans_only_while_watched)
  | test(=saved_connections_are_listed_while_read_and_switched)
  | test(=the_buses_are_an_error_without_a_tokio_runtime)
  | test(=without_a_bus_history_says_why)
  | test(=without_a_bus_up_fails_naming_the_connection)
  | test(=without_bluez_pair_and_forget_fail_as_events)
  | test(=an_unreachable_network_is_unavailable_and_fails_as_values)
  | test(=an_unreachable_bus_sends_an_empty_boot_batch))'''
retries = 1
slow-timeout = { period = "60s", terminate-after = 15, grace-period = "30s" }

# The nightly stress job (scripts/container/stress.sh; decisions.md robustness):
# no retry, so every failure counts towards a rate, and a junit file for each
# run, which `stress-summary.py` reads. A hang costs 15 minutes here rather than
# the 40 of the other profiles, the longest test being under 4.
[profile.stress]
junit = { path = "junit.xml", store-success-output = false, store-failure-output = true }
retries = 0
slow-timeout = { period = "60s", terminate-after = 15, grace-period = "30s" }

# The nightly validation job (scripts/container/validation.sh): every test's
# output in the junit file, where validation-summary.py reads what the layer said.
[profile.validation]
junit = { path = "junit.xml", store-success-output = true, store-failure-output = true }
retries = 0
slow-timeout = { period = "60s", terminate-after = 15, grace-period = "30s" }
