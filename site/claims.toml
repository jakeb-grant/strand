# The claims ledger: every factual claim the site's own pages (site/**.md)
# make about Strand, with where it is proven. strand-site checks that each
# `text` occurs in its page and that each `source` exists; the people who
# fact-check the site check that the source says what the text says.
#
# [[claim]]
# page   = "site/concepts/motion.md"       # the page, from the repository root
# text   = "Below a ratio of 1 it overshoots"  # words exactly as on the page
# source = ['crates/strand-core/src/anim.rs "the words it cites"', "docs/design.md#motion-and-time"]
# proof  = "crates/strand-core/tests/springs.rs::underdamped_overshoots"  # a test, or how it was seen
#
# A source is `path "snippet"`, `path.md#heading` or a bare `path`, the path
# from the repository root. A snippet is at least 8 characters that must occur
# in the file, whitespace runs counting as one space, so it fails the build
# when the words it cites go. Write it in a TOML literal string, in single
# quotes, so its own quotes need no escaping. `path:line` and `path:first-last`
# fail the build: a line number goes stale without a word. So does a source that
# is the claim's own page or this file, which hold the words whatever is true.
#
# Rewording a line this file quotes fails the site's build, so `affected` runs
# strand-site's build test for a changed file a `source` here names.

# --- start-tools-help ---
