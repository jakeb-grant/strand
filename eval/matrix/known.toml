# The effect matrix's accepted failures (docs/eval.md, "Matrix"): a cell
# listed here may fail the checks named on the nodes named (selectors),
# and only those; the same check failing on any other node fails the
# cell, and a listed check that passes is stale and fails the matrix, so
# a fix removes its line. `nodes = ["*"]` is any node, and the only way
# to accept a finding on no node (a surface's pixels): its note says so.
# Keys are cells (`a`, `a+b` in effects.toml's order), optionally at one
# rate (`a+b@144`). Every entry says why and since when; a finding is
# listed here only after it was triaged as the product's (or the
# sandbox's known limit), never to make a cell pass.
#
# ["enter-slide+late-text-1"]
# checks = ["envelope"]
# nodes = ["#subject"]
# note = "why"
# since = "2026-10-17"

# Product finding (eval-sandbox matrix, first 144 Hz run): a change
# starts at most START_LEAD (16.7 ms, one 60 Hz refresh) before the
# first frame that shows it, and never before the surface's previous
# paint (strand-scene motion.rs, `Animator::begin(time, painted_time)`).
# After idle ticks on a 144 Hz surface the previous paint is long ago, so
# the first frame of a glide shows 16.7 ms of progress, 2.4 ticks: the
# exiting tags of text-estimate-far+stagger@144 jump 27 px at k77 where
# the next ticks move 18. And a GPU-presented surface paints at buffer
# age 0 (Renderer::paint_gpu), so every paint, damage or not, sets its
# painted_time: the same glide leads by one tick there, not 2.4, and the
# CPU and GPU legs draw its first frames apart (flip-reorder+gpu@144 k25:
# glide 10.36 px left on the CPU, 13.17 on the GPU; the same in lean+gpu).
# At 60 Hz both leads are one tick. Not fixed here (strand-render).

["text-estimate-far+stagger@144"]
checks = ["teleport"]
nodes = ["#tag1", "#tag2"]
note = "a glide's first frame after idle ticks leads by START_LEAD (2.4 ticks at 144 Hz): the exiting tags jump 27 px"
since = "2026-10-17"

["flip-reorder+gpu@144"]
checks = ["cpu-gpu"]
nodes = ["*"]
note = "a glide's first-frame lead depends on the backend at 144 Hz (GPU paints at age 0 and moves painted_time every tick); one of its findings is the surface's pixels, on no node, hence `*`"
since = "2026-10-17"

["lean+gpu@144"]
checks = ["cpu-gpu"]
nodes = ["#subject", 'text("iiii")']
note = "a glide's first-frame lead depends on the backend at 144 Hz (GPU paints at age 0 and moves painted_time every tick)"
since = "2026-10-17"

# The same lead, shown once exit-height0 was fixed: the collapsed
# subject now stays drawn at height 0 until it unmounts, so the CPU leg
# paints nothing for the ticks before (its painted_time falls behind)
# where the one-frame flash used to paint; the glide of #label and #after
# into its gap then leads by 2.4 ticks on the CPU and one on the GPU
# (k80: 13.31 px left on the CPU, 17 on the GPU).

["exit-height0+gpu@144"]
checks = ["cpu-gpu"]
nodes = ["*"]
note = "a glide's first-frame lead depends on the backend at 144 Hz (the gap's glide after the collapsed subject unmounts); two of its findings are the surface's (frames wanted and painted), on no node, hence `*`"
since = "2026-10-17"
