[package]
name = "strand-auth"
description = "The lock screen's PAM helper and the client that spawns it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# The whole security boundary of the lock screen (docs/architecture.md,
# "Crate graph"): the lib depends on libc and zeroize and no Strand
# crate; the `strand-auth` binary adds a hand-written PAM FFI and is the
# only code in the workspace that links libpam.

[features]
default = []
# Test hooks, never in a default or release build
# (tests/no_faults.rs): `STRAND_FAULT` injection points in the helper
# (`auth_crash`, `auth_hang`, `auth_garbage`), a private PAM confdir
# (`STRAND_AUTH_PAM_CONFDIR`, through `pam_start_confdir`) and
# `Client::with_test_env`, which passes those through the client's
# scrubbed environment.
faults = []

[dependencies]
libc = "0.2.190"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"

# The tests that need the hooks name the feature, and run only with
# `cargo test -p strand-auth --features faults` (CI's test job). A
# dev-dependency of the crate on itself with `faults` turned the hooks
# on in every test build, and cargo copies a test build's binary to
# `target/<profile>/strand-auth`, so `cargo test --release` left a
# helper with the hooks where a package installs from
# (tests/plain_build.rs; decisions.md, m4-audit).
[[test]]
name = "pam"
required-features = ["faults"]

[[test]]
name = "no_faults"
required-features = ["faults"]

[lints]
workspace = true
