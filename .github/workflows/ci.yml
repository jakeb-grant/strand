name: CI

on:
  push:
  pull_request:
  # The long reload fuzzer and latency runs (design.md, "Testing": reload
  # fuzzer "every push, longer runs nightly").
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The Wayland and budget tiers fail instead of skipping when sway is missing.
  STRAND_REQUIRE_SWAY: "1"
  # The services tier (private dbus-daemon, python-dbusmock, the mock
  # portal) fails instead of skipping when its tools are missing.
  STRAND_REQUIRE_DBUS: "1"
  # The audio tier (a private PipeWire with null sinks and WirePlumber)
  # fails instead of skipping when pipewire or wireplumber is missing.
  STRAND_REQUIRE_PIPEWIRE: "1"
  # The GPU tier (M4) runs on Mesa's lavapipe, software Vulkan, and fails
  # instead of skipping when no Vulkan device starts (decisions.md
  # m4-owner). Lavapipe is the only driver the loader is given
  # (VK_ICD_FILENAMES is the deprecated spelling), with a fixed llvmpipe
  # vector width so GPU pixels do not depend on the runner's CPU; as in
  # scripts/container/Dockerfile.
  STRAND_REQUIRE_GPU: "1"
  # Lavapipe is a software adapter, which strand counts as no device
  # unless this is set (docs/architecture.md, "`strand-gpu`").
  STRAND_GPU_SOFTWARE: "1"
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
  LP_NATIVE_VECTOR_WIDTH: "256"
  # No debug info: a full debug test build of the workspace with it does
  # not fit the runner's disk (as in the dev container, CLAUDE.md).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # The checks of every push, split into jobs that run side by side (the
  # single `check` job took about 23 min; docs/decisions.md, laptop-ci).
  # Each job starts from .github/actions/setup. scripts/container/ci.sh
  # runs the same steps in order, in one container.

  # Formatting and lints: no tests, the build headers only.
  lint:
    if: github.event_name != 'schedule'
    # Pinned: the pixel references (crates/strand/tests/refs) come from
    # 24.04's sway 1.9, fonts-dejavu-core 2.37 and adwaita-icon-theme 46;
    # a newer image would change glyph and icon pixels. Every job uses
    # the same image.
    runs-on: ubuntu-24.04
    # A hang fails instead of holding the runner for GitHub's default 6 h.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tier: headers
          free-disk: "false"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # niri's IPC (design.md, "Risks") and PipeWire audio (libpipewire)
      # sit behind default-on features; the build without them must stay
      # clean too.
      - run: cargo clippy -p strand-services --no-default-features --all-targets
      # The CPU core without the GPU backend (no wgpu, vello_gpu, naga or
      # libwayland-client; the 15 MiB `.text` gate's build).
      - run: cargo clippy -p strand --no-default-features --all-targets
      - run: cargo build -p strand --no-default-features
      # Targets behind a non-default feature (strand's `[[test]] lock`
      # needs `faults`, and so does run/lock.rs's fault module) are out
      # of the default build: lint them too (m4-plan, "Feature legs").
      - run: cargo clippy --workspace --all-targets --all-features

  # The debug test build: the workspace's tests, the 100 reloads and the
  # reload fuzzer's short run.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo test -p strand-services --no-default-features --lib
      # The reload fuzzer runs on its own below (timing-sensitive saves),
      # and the 100 reloads too.
      - run: cargo test --workspace -- --skip random_edits_through_five_save_styles --skip a_hundred_reloads_reconnect_and_restart_nothing
      # M3 exit, "100 reloads with no reconnects": a shell reading every
      # builtin service but screens and auth (python-dbusmock's daemons,
      # a mock portal, a tray item and an MPRIS player on a private bus,
      # sway's IPC, a private PipeWire), 100 token, markup and binding
      # edits through `strand run`'s watcher: no service restarted (start
      # log), no bus connection but the from-dbus introspection refresh
      # (bus monitor), no mock called, the same sockets, no sway IPC
      # accept (sway -d log), no new PipeWire object of strand's (pw-mon),
      # no state reset; then a negative control (a changed custom service
      # restarts alone).
      # It takes under a minute; its own watchdog prints the stage and
      # the logs and aborts after 5 min, this bound backs it.
      - run: cargo test -p strand --test reloads -- --nocapture
        timeout-minutes: 10
      # The reload fuzzer's short run: 60 edits through the five save
      # styles and the sway pipeline, on tmpfs, alone (a descheduled test
      # thread splits a delete-and-create save; a gap of at most 20 ms,
      # still past the 15 ms coalescing, leaves it 30 ms of the watcher's
      # 50 ms grace).
      - run: cargo test -p strand --bin strand random_edits_through_five_save_styles -- --nocapture --test-threads=1
        env:
          STRAND_FUZZ_MAX_GAP_MS: "20"

  # The memory gates, on the real release profile: its per-package
  # opt-levels are what the budgets rest on (crates/strand/tests/
  # budgets.rs checks them).
  budgets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # One dependency cache for both release jobs; this one saves it.
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      # The bar's PSS budget (34 MB target warns, 38 MB ceiling fails) is checked on a release build (design.md, "Testing": budgets).
      - run: cargo test --release -p strand --test demo
      # The same gate and the idle budget on the real services (private
      # bus, mock portal): `the_real_services_sleep_when_nothing_changes`.
      - run: cargo test --release -p strand --test services -- --test-threads=1
      # M3 exit, "memory verified": design.md's bar on two 2560x1440
      # outputs reading battery, network, audio, workspaces, windows,
      # tray and notifications on the real backends (python-dbusmock's
      # UPower, NetworkManager and logind and a mock portal on a private
      # bus, the shell's own notifications server and tray host, sway's
      # IPC, a private PipeWire) within the PSS budget (34 MB target
      # warns, 38 MB ceiling fails) with no huge
      # page, then 10 s without a wakeup or a frame; and the full shell
      # (launcher open at 2x, two toasts, the OSD) printed against
      # design.md's 59-64 MB (64 MB target warns, 70 MB ceiling fails).
      - run: cargo test --release -p strand --test budgets -- --nocapture --test-threads=1
      # The CPU core's .text keeps its 15 MiB gate behind the GPU
      # backend's 18.5 MiB (docs/architecture.md, "`strand-gpu`").
      - run: cargo test --release -p strand --no-default-features --test budgets the_release_binary_code_stays_within_its_gate -- --nocapture

  # M2 exit: design.md's four example shells and theme.strand, byte for
  # byte, in `strand run` on headless sway with two outputs against the
  # deterministic mock services, driven by clicks, the wheel, keys,
  # `strand set` and mock service changes; settled screenshots compared
  # with crates/strand/tests/refs/acceptance. Release, so frames of the
  # slides and swaps are caught (the test job runs them in debug without
  # those).
  acceptance:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: release
          cache-save: "false"
      - run: cargo test --release -p strand --test acceptance -- --nocapture --test-threads=1
      # A screenshot that missed its reference, with its diff.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-shots
          path: target/acceptance/
          if-no-files-found: ignore

  # The timing gates, on the `timing` profile (Cargo.toml): release's
  # opt-levels without its link-time optimisation, which they do not
  # measure.
  timing:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # A theme swap within design.md's 5 ms of work (logic's re-resolve,
      # the render thread's springs and contrast check, the token graph
      # of every frame) on an optimised build.
      - run: cargo test --profile timing -p strand-render --test theme_swap_bench -- --nocapture
      # Save → pixels p95 within design.md's 35 ms (token) and 50 ms
      # (markup) on an optimised build, to the painted buffer and to the
      # frame sway presents, and a monitor or portal change (a mock
      # portal's SettingChanged on a private bus) on the next frame;
      # ignored in debug builds.
      # 50 edits each so p95 is not the worst of 20 samples (the token
      # gate's headroom is thin: 1.6 ms at p95 in GitHub run 37647946808,
      # 0.5 ms in a reviewer's local run; see docs/m1-report.md).
      - run: cargo test --profile timing -p strand --bin strand reload_latency -- --nocapture --test-threads=1
        env:
          STRAND_LATENCY_ROUNDS: "50"
      # M4 exit "smooth 2,000-row scrolling": a 2,000-row list's render
      # frame p95 within 3.5 ms at 60 and 144 Hz on an optimised build,
      # with logic's window answers 50 ms late and no stalled frame
      # (decisions.md m4-lists-w1).
      - run: cargo test --profile timing -p strand-render --test list_scroll_bench -- --nocapture

  # M3 exit: "runs on Hyprland, niri and sway". The stores and design.md's
  # bar in `strand run` against each live compositor, compared with what
  # its own CLI reports (crates/strand/tests/compositor_matrix.rs, run by
  # scripts/compositor-matrix.sh). Hyprland and niri are packaged on Arch,
  # not on the Ubuntu runner: the test is built here and run in an
  # archlinux:latest container. Hyprland's aquamarine allocates on a DRM
  # node even for headless outputs, so the runner loads vkms (a virtual
  # KMS card, rendered by Mesa's llvmpipe) and passes it in; niri runs
  # nested (winit) in a headless sway; sway runs headless.
  # It runs nightly too: archlinux:latest installs the current Hyprland,
  # niri, sway and labwc, so an upstream release that breaks an adapter
  # fails here within a day without a push. A failure names the
  # compositor and its package version (an annotation and the job
  # summary; decisions.md laptop-resilience).
  compositors:
    name: "${{ github.event_name == 'schedule' && 'compositors (nightly: archlinux:latest Hyprland, niri, sway, labwc)' || 'compositors' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev libpam0g-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: compositors
      - name: Build the compositor matrix test
        id: build
        run: |
          # The binary's path from cargo's JSON messages: the human
          # "Executable" line carries colour codes under CARGO_TERM_COLOR.
          cargo test -p strand --test compositor_matrix --no-run --message-format=json >build.json
          test=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "compositor_matrix" and .executable != null) | .executable' build.json | tail -1)
          echo "matrix test: $test"
          test -x "$test"
          echo "test=$test" >>"$GITHUB_OUTPUT"
      - name: A virtual KMS card (vkms)
        id: drm
        run: |
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" || echo "no linux-modules-extra-$(uname -r); trying the modules present"
          before=$(ls -d /sys/class/drm/card* 2>/dev/null || true)
          sudo modprobe vkms
          sudo udevadm settle || true
          ls -l /dev/dri
          card=
          for c in /sys/class/drm/card*; do
            name=$(basename "$c")
            case "$name" in *-*) continue ;; esac
            echo "$before" | grep -qx "$c" && continue
            card=/dev/dri/$name
          done
          [ -n "$card" ] || { echo "::error::no card appeared for vkms"; exit 1; }
          echo "vkms card: $card"
          echo "card=$card" >>"$GITHUB_OUTPUT"
      - name: sway, niri, Hyprland and labwc (archlinux:latest)
        run: |
          docker run --rm --device /dev/dri -v "$PWD:$PWD" -w "$PWD" \
            -e STRAND_DRM_CARD=${{ steps.drm.outputs.card }} \
            archlinux:latest bash scripts/compositor-matrix-ci.sh "${{ steps.build.outputs.test }}"
      # Each compositor's package version and result, on the run's page.
      - name: Compositor versions and results
        if: always()
        run: cat target/matrix/summary.md >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compositor-matrix
          path: target/matrix/
          if-no-files-found: ignore

  # The lock screen's VM tier (design.md, "Testing": a real PAM stack in
  # a QEMU VM "before touching the lock code, and before releases"):
  # scripts/container/lockvm.sh, as on the laptop. GitHub's standard
  # Linux runners expose /dev/kvm (hardware-accelerated Android
  # virtualization, 2024-04-02) once a udev rule opens it; that sudo
  # step runs on the runner only, never in the container scripts. A
  # runner without /dev/kvm fails here instead of emulating. Runs
  # nightly, on demand, on tags and on pushes and pull requests that
  # touch the lock code or the harness.
  lock-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Lock paths changed
        id: paths
        if: (github.event_name == 'push' && github.ref_type == 'branch') || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lock:
              # S-lock's files as the M4 critique's ownership table names
              # them; the globs also catch them if they land elsewhere in a
              # crate. Keep this list in step with the lock code.
              - 'crates/strand-auth/**'
              - 'crates/**/*session_lock*'
              # Lock logic in shared surface-manager files that only the
              # lock VM exercises: the deferred configure ack and no bare
              # commit on `Role::Lock` (commit.rs), the pixel surfaces'
              # keyboard focus (seat.rs), lock routing in
              # `apply_surface_change`/`reconcile` (mod.rs), no popup on a
              # lock surface (popup.rs).
              - 'crates/strand-surface/src/manager/commit.rs'
              - 'crates/strand-surface/src/manager/seat.rs'
              - 'crates/strand-surface/src/manager/mod.rs'
              - 'crates/strand-surface/src/manager/popup.rs'
              - 'crates/**/*lock_fallback*'
              - 'crates/strand/src/lock.rs'
              - 'crates/strand/src/run/lock.rs'
              # The main loop's lock gating (Guard::check, signals and
              # logic ending held while locked), the heartbeat, lock
              # faults and password redaction on the logic thread.
              - 'crates/strand/src/run/mod.rs'
              - 'crates/strand/src/run/shell.rs'
              - 'crates/strand/src/run/logic.rs'
              # The `faults` feature the VM build turns on.
              - 'crates/strand/Cargo.toml'
              # The fallback's painting and keys in the binary's host.
              - 'crates/strand/src/demo/host.rs'
              - 'crates/strand/tests/lock.rs'
              - 'crates/strand/tests/lock/**'
              # Lock solids: single-pixel buffers and the shm fallback.
              - 'crates/strand-surface/src/solid.rs'
              - 'crates/strand-surface/src/manager/scrim.rs'
              - 'crates/strand/src/services/auth*'
              - 'crates/strand-services/src/auth.rs'
              - 'crates/strand-services/tests/auth.rs'
              - 'crates/strand-services-schema/src/auth.schema'
              - 'crates/strand-compiler/src/check/lock.rs'
              - 'scripts/lockvm/**'
              - 'scripts/container/*lockvm*'
              - 'scripts/container/lockvm/**'
      - name: Decide
        id: run
        run: |
          case "${{ github.event_name }}:${{ github.ref_type }}:${{ steps.paths.outputs.lock }}" in
            schedule:* | workflow_dispatch:* | push:tag:* | *:true) echo "go=true" >>"$GITHUB_OUTPUT" ;;
            *) echo "go=false" >>"$GITHUB_OUTPUT"; echo "no lock paths changed: the lock VM tier is skipped" ;;
          esac
      - name: KVM for the runner's user
        if: steps.run.outputs.go == 'true'
        run: |
          ls -l /dev/kvm || { echo "::error::this runner has no /dev/kvm"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          ls -l /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm || { echo "::error::/dev/kvm is not read-writable"; exit 1; }
      # S-lock's scenarios (scripts/lockvm/scenarios/all.sh): the session
      # lock on headless sway, the strand binary's fault matrix (built
      # with `--features faults`) and the shipping helper against real
      # pam_unix, built here (the guest is the runner's Ubuntu release).
      - uses: ./.github/actions/setup
        if: steps.run.outputs.go == 'true'
        with:
          tier: headers
          cache-save: "false"
      - name: Build the lock VM scenarios' binaries
        if: steps.run.outputs.go == 'true'
        run: bash scripts/lockvm/scenarios/build.sh
      - name: Lock VM scenarios
        if: steps.run.outputs.go == 'true'
        run: scripts/container/lockvm.sh bash scripts/lockvm/scenarios/all.sh
        env:
          LOCKVM_TIMEOUT: "600"

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The M1 exit gate: 10,000 random edits, each saved in all five
      # editor styles into a live pipeline on tmpfs (/dev/shm), and in
      # place into the pipeline on headless sway. On the `timing`
      # profile, the latency run's build below.
      - run: cargo test --profile timing -p strand --bin strand random_edits_through_five_save_styles -- --nocapture
        env:
          STRAND_FUZZ_EDITS: "10000"
          # A new sequence each night; the seed is printed to replay it.
          STRAND_FUZZ_SEED: ${{ github.run_id }}
      # The same 10,000 edits on the instance level, and the state table,
      # on the same profile so the job builds one optimised tree.
      - run: cargo test --profile timing -p strand-compiler --test reload random_ -- --nocapture
        env:
          STRAND_RELOAD_FUZZ: "10000"
          STRAND_STATE_FUZZ: "2000"
      # The timing job's latency gate with 200 edits each.
      - run: cargo test --profile timing -p strand --bin strand reload_latency -- --nocapture --test-threads=1
        env:
          STRAND_LATENCY_ROUNDS: "200"
