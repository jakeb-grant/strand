[package]
name = "strand-services"
description = "Lazy, refcounted system services over zbus, PipeWire and compositor IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["niri"]
# niri's IPC changes in patch versions (design.md, "Risks"), so our own
# implementation of it sits behind a flag.
niri = []

[dependencies]
strand-core.workspace = true
strand-watch.workspace = true
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
# `unbounded_depth`: sway trees decode without a recursion limit, as
# swayipc-types does.
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
tokio = { version = "1.53", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
futures-lite = { version = "2.6", default-features = false, features = ["std"] }
# sway's adapter (design.md names swayipc-async 3.0): its types, over our
# own lossy i3-ipc framing on tokio.
swayipc-async = "3.0.0"
# The Wayland toplevel and workspace protocols, on their own thread.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
rustix = { version = "1.1.5", features = ["event"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53", features = ["rt", "macros", "sync", "time", "net", "io-util", "test-util"] }
rustix = { version = "1.1.5", features = ["event", "process", "fs", "shm"] }
wayland-server = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "server", "staging"] }

[lints]
workspace = true
