[package]
name = "strand-compiler"
description = "Parser, type checker, bytecode and reconciler for .strand files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
strand-core.workspace = true
strand-scene.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.151"
miette = { version = "7.6.0", default-features = false, features = ["fancy-no-backtrace"] }
strsim = "0.11.1"
blake3 = "1.8.7"
stacker = "0.1.25"
similar = "2.7.0"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.11.0"
strand-scene.workspace = true
strand-render.workspace = true
strand-text.workspace = true

[lints]
workspace = true
