[package]
name = "strand-services"
description = "Lazy, refcounted system services over zbus, PipeWire and compositor IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
strand-core.workspace = true
strand-services-macros.workspace = true
# The schema texts it serves (shared with the LSP, which does not link
# this runtime).
strand-services-schema.workspace = true
# The portal Settings client (`follow`) runs on the services runtime.
strand-watch.workspace = true
log = { version = "0.4.34", features = ["std"] }
# `net`: the backlight watch (inotify) on the runtime's reactor.
tokio = { version = "1.53", features = ["rt", "macros", "sync", "time", "net"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# Streams of signals (zbus's own `futures-lite` streams).
futures-lite = { version = "2.6", default-features = false, features = ["std"] }
# logind's `SetBrightness` for `brightness` writes (design.md's table).
logind-zbus = { version = "5.3.2", default-features = false }
# The backlight's sysfs files, watched (inotify).
rustix = { version = "1.1.5", features = ["fs"] }
# A notification's arrival time as a `Date`, in the local zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Pixmaps (tray icons, notification `image-data`) written as PNG files for
# `image`.
png = "0.18.1"
# Desktop entries for `apps` (design.md's table).
freedesktop-desktop-entry = { version = "0.8.3", default-features = false }
# Fuzzy matching with match ranges for `apps.search`, wrapped (design.md:
# "wrap it, fork if needed").
nucleo = "0.5.0"
# The icon theme lookup the renderer uses: an app's icon is checked
# against it.
strand-icons.workspace = true
# `apps` launches detached (setsid and a second fork before exec).
libc = "0.2.190"

[dev-dependencies]
# Tests point the icon lookup at a theme of their own.
strand-icons.workspace = true
tokio = { version = "1.53", features = ["rt-multi-thread"] }
# Bodies of the test's own D-Bus calls.
serde = "1.0.228"

[lints]
workspace = true
