[package]
name = "strand"
description = "The Strand shell runtime and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The lock's fault injection points (`STRAND_FAULT`) for the lock VM's
# fault matrix (tests/lock.rs, scripts/lockvm/scenarios/strand_lock.sh),
# with strand-auth's own (the helper's faults, `Client::with_test_env`).
# Never in a default or release build: budgets.rs's
# `the_binary_holds_no_fault_code` checks the binary's bytes.
faults = ["strand-auth/faults"]

[dependencies]
# The built-in fallback lock's own password client (`run/lock.rs`).
strand-auth.workspace = true
strand-compiler.workspace = true
strand-core.workspace = true
strand-render.workspace = true
strand-scene.workspace = true
strand-services.workspace = true
# The icon lookup's cache, invalidated when an icon base directory changes.
strand-icons.workspace = true
# `from dbus` services checked against introspection (strand check, the
# loader).
strand-introspect.workspace = true
strand-surface.workspace = true
strand-text.workspace = true
# The last palette and the portal's values written off the logic thread.
strand-theme.workspace = true
strand-watch.workspace = true
calloop = "0.14.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
log = { version = "0.4.34", features = ["std"] }
# `no_thp`: mimalloc v3 madvises its arenas for transparent huge pages,
# which (THP in `madvise` mode) made 2 MiB pages resident for a few KiB
# of heap: 55 MB PSS for the design bar instead of about 22 (docs/m2-report.md).
# With THP in `always` mode the kernel does so unasked: `main` turns THP
# off for the process (rustix `thread`: `PR_SET_THP_DISABLE`).
mimalloc = { version = "0.1.52", default-features = false, features = ["no_thp"] }
# `mi_collect`: freed memory returned once the shell goes quiet (run.rs).
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
libc = "0.2.190"
rustix = { version = "1.1.5", features = ["event", "thread", "time"] }
serde_json = "1.0.151"

[dev-dependencies]
# Bodies of the D-Bus calls the services tests make.
serde = "1.0.228"
# A mock portal on a private bus (the theme's end-to-end test).
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "time"] }
# A bus monitor's message stream (the 100 reloads' bus check).
futures-util = { version = "0.3.34", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
rustix = { version = "1.1.5", features = ["process", "event", "fs"] }
# The compositor and audio end-to-end test: a real window (xdg-shell) on
# sway and a private PipeWire (strand-services' test helpers).
wayland-protocols = { version = "0.32.13", features = ["client"] }
tempfile = "3.27.0"

[lints]
workspace = true

# The lock VM's fault matrix: run only there (each test skips elsewhere),
# built by scripts/lockvm/scenarios/build.sh with `--features faults`.
[[test]]
name = "lock"
required-features = ["faults"]
