[package]
name = "strand-services"
description = "Lazy, refcounted system services over zbus, PipeWire and compositor IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["niri", "pipewire"]
# niri's IPC changes in patch versions (design.md, "Risks"), so our own
# implementation of it sits behind a flag.
niri = []
# The `audio` service (PipeWire). Building it needs libpipewire's headers
# and libclang (bindgen), and the binary then links libpipewire-0.3; a
# build without it answers `audio.*` at the schema's defaults.
pipewire = ["dep:pipewire"]

[dependencies]
strand-core.workspace = true
strand-services-macros.workspace = true
# `auth`: the lock screen's PAM helper client (the helper is a process
# of its own; only it links libpam).
strand-auth.workspace = true
# (services-round) Answers to polkit's helper and greetd, built in buffers
# wiped when dropped, as strand-auth builds its frames.
zeroize = "1.9.1"
# The schema texts it serves (shared with the LSP, which does not link
# this runtime).
strand-services-schema.workspace = true
# The portal Settings client (`follow`) runs on the services runtime.
strand-watch.workspace = true
log = { version = "0.4.34", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
# `unbounded_depth`: sway trees decode without a recursion limit, as
# swayipc-types does. No-code services also read documents that are JSON.
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
# `net`: the backlight watch (inotify) and the compositor IPC sockets on
# the runtime's reactor. `process`, `io-util`: the commands of no-code
# `listen` and `poll` services, and the IPC sockets.
tokio = { version = "1.53", features = ["rt", "macros", "sync", "time", "net", "process", "io-util"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# Streams of signals (zbus's own `futures-lite` streams).
futures-lite = { version = "2.6", default-features = false, features = ["std"] }
# logind's `SetBrightness` for `brightness` writes (design.md's table).
logind-zbus = { version = "5.3.2", default-features = false }
# The backlight's sysfs files, watched (inotify); the Wayland client's poll;
# a thumbnail's shm buffer, mapped to read (`mm`); `network.address`'s
# rtnetlink socket and an interface's index (`net`).
rustix = { version = "1.1.5", features = ["event", "fs", "mm", "net"] }
# A notification's arrival time as a `Date`, in the local zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Pixmaps (tray icons, notification `image-data`) written as PNG files for
# `image`.
png = "0.18.1"
# `media.art`'s remote (https, http) art (decisions.md, m6-services): a
# small blocking client run on the runtime's blocking pool, TLS by rustls
# with ring (no OpenSSL), trusting the system's certificates. No gzip,
# cookies or JSON.
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
# Desktop entries for `apps` (design.md's table).
freedesktop-desktop-entry = { version = "0.8.3", default-features = false }
# Fuzzy matching with match ranges for `apps.search`, wrapped (design.md:
# "wrap it, fork if needed").
nucleo = "0.5.0"
# The grapheme clusters nucleo matches by (its default segmentation),
# mapped back to the character ranges a hit reports.
unicode-segmentation = "1.13.3"
# The icon theme lookup the renderer uses: an app's icon is checked
# against it.
strand-icons.workspace = true
# No-code services: their D-Bus objects' introspection.
strand-introspect.workspace = true
# `apps` launches detached (setsid and a second fork before exec).
libc = "0.2.190"
# sway's adapter: swayipc-types, the types design.md's swayipc-async 3.0
# re-exports (it pins swayipc-types 2.0), over our own lossy i3-ipc
# framing on tokio; without swayipc-async's async-io stack (decisions.md,
# wave4-wm). Its default `error` feature holds the `decode` functions.
swayipc-types = "2.0.3"
# The Wayland toplevel and workspace protocols, on their own thread.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
# `zwlr_foreign_toplevel_management_v1`: focus, state and window actions
# on compositors without an IPC adapter (labwc, wayfire, river), on the
# same thread.
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# (services-round) `keyboard.layouts` on Hyprland, which names only the
# active layout: its keyboard's xkb rule names compiled to name the rest
# (the libxkbcommon strand-surface already links).
xkbcommon = { version = "0.8.0", default-features = false }
# xkeyboard-config's layout list, for `keyboard.layout_code` (read while a
# reader shows it): the version resvg already links.
roxmltree = "0.21.1"
# Audio (design.md names pipewire 0.10): its own `strand-pipewire` thread,
# since pipewire-rs is `!Send`. `v1_0_0`: the oldest PipeWire we build
# against (Ubuntu 24.04's 1.0.5).
pipewire = { version = "0.10.1", features = ["v1_0_0"], optional = true }

[dev-dependencies]
# The fake compositor tests/protocol.rs and the wm protocol client's unit
# tests run against (shared with strand-surface's tests).
strand-fake-wayland = { path = "../strand-fake-wayland" }
# Tests point the icon lookup at a theme of their own.
strand-icons.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "test-util"] }
rustix = { version = "1.1.5", features = ["event", "process", "fs", "shm"] }
# A virtual keyboard with named layouts on a real sway (tests/sway.rs,
# keyboard.rs; gap 31).
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }

[lints]
workspace = true
