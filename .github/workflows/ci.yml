name: CI

on:
  push:
  pull_request:
  # The long reload fuzzer and latency runs (design.md, "Testing": reload
  # fuzzer "every push, longer runs nightly").
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      stress_minutes:
        description: The stress job's time for its blocks (scripts/container/stress.sh)
        default: "180"
      report_red:
        description: A red run files the nightly-red issue, as a scheduled one does ("true" or "false")
        default: "false"

# A newer push to a branch or pull request cancels the run it supersedes.
# No run is cancelled for any other reason, or made to wait, here: main, tags,
# schedule and dispatch each get a group of their own (the run's id), because
# a shared group, even with cancel-in-progress off, runs one at a time and
# replaces a pending run with the next. Of the job-level groups, deploy's and
# release's run one at a time and replace a job waiting there with a newer
# one, which is what they are for; image-publish's can drop a third run of a
# branch that publishes a new Dockerfile, said at that job (decisions.md
# ci-speed-2).
concurrency:
  group: ${{ ((github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main') || github.event_name == 'pull_request') && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main') || github.event_name == 'pull_request' }}

# All the check jobs use: the checkout, and paths-filter's list of a pull
# request's files. Written here so that changing the repository's default can't
# hand every job, test code included, a token that writes. The four jobs that
# write name their own scopes: image-publish, release, nightly-red and
# prune-caches.
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The Wayland and budget tiers fail instead of skipping when sway is missing.
  STRAND_REQUIRE_SWAY: "1"
  # The services tier (private dbus-daemon, python-dbusmock, the mock
  # portal) fails instead of skipping when its tools are missing.
  STRAND_REQUIRE_DBUS: "1"
  # The audio tier (a private PipeWire with null sinks and WirePlumber)
  # fails instead of skipping when pipewire or wireplumber is missing.
  STRAND_REQUIRE_PIPEWIRE: "1"
  # The GPU tier (M4) runs on Mesa's lavapipe, software Vulkan, and fails
  # instead of skipping when no Vulkan device starts (decisions.md
  # m4-owner). Lavapipe is the only driver the loader is given
  # (VK_ICD_FILENAMES is the deprecated spelling), with a fixed llvmpipe
  # vector width so GPU pixels do not depend on the runner's CPU; as in
  # scripts/container/Dockerfile.
  STRAND_REQUIRE_GPU: "1"
  # Lavapipe is a software adapter, which strand counts as no device
  # unless this is set (docs/architecture.md, "`strand-gpu`").
  STRAND_GPU_SOFTWARE: "1"
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
  LP_NATIVE_VECTOR_WIDTH: "256"
  # No debug info: a full debug test build of the workspace with it does
  # not fit the runner's disk (as in the dev container, CLAUDE.md).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Every job builds from its cache, never incrementally (Cargo.toml's dev
  # profile is incremental for the laptop's edits; decisions.md ci-speed).
  CARGO_INCREMENTAL: "0"

jobs:
  # The CI image, one for these jobs and the laptop: scripts/container/
  # Dockerfile at ghcr.io/jakeb-grant/strand-ci:<its hash>, published the
  # first time a run needs it (decisions.md ci-speed-2; publish-image.sh says
  # what can write a tag twice). The compositor matrix's Dockerfile.matrix the
  # same, at strand-matrix.
  # `image` looks, with no registry login; `image-publish` is the only job
  # that may write to packages, and always runs, so the jobs after it need no
  # special `if`. A branch's runs that will publish share a group, by branch: a
  # push and its pull request start together with one new Dockerfile, and one
  # waits for the other, then finds the tag. GitHub keeps only the newest job
  # waiting in a group, so a third run there replaces the second. A third
  # usually takes a new push or a reopened pull request, which the workflow's
  # group above is already cancelling; but two pull requests from one branch to
  # different bases have groups of their own there and share this one, so the
  # middle run's job is cancelled with nothing superseding it. That run shows as
  # cancelled, not green, and a re-run passes. Every other run is alone in its
  # group here and nothing can cancel it: main, a tag, schedule and dispatch
  # may publish side by side with another ref, publish-image.sh asking the
  # registry before its build and again before its push.
  # A fork's pull request gets no write access from GitHub and is not asked
  # to try: run.sh pulls the tag or, for a Dockerfile of its own, builds it.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        env:
          MAY_WRITE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          missing=$(scripts/container/publish-image.sh missing)
          matrix=$(STRAND_IMAGE_FILE=Dockerfile.matrix scripts/container/publish-image.sh missing)
          publish=false
          if { [ "$missing" = true ] || [ "$matrix" = true ]; } && [ "$MAY_WRITE" = true ]; then publish=true; fi
          echo "publish=$publish" >>"$GITHUB_OUTPUT"

  image-publish:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ needs.image.outputs.publish == 'true' && ((github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main') || github.event_name == 'pull_request') && format('ci-image-publish-{0}', github.head_ref || github.ref_name) || format('ci-image-none-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        if: needs.image.outputs.publish == 'true'
        with:
          persist-credentials: false
      - name: Publish the image
        if: needs.image.outputs.publish == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          scripts/container/publish-image.sh publish
          STRAND_IMAGE_FILE=Dockerfile.matrix scripts/container/publish-image.sh publish

  # The checks of every push, split into jobs that run side by side (the
  # single `check` job took about 23 min; docs/decisions.md, laptop-ci).
  # Each job starts from .github/actions/setup, and all but `wasm` run their
  # commands in the image, through run.sh as on the laptop.
  # scripts/container/ci.sh runs the same steps in order, in one container.

  # Formatting and lints: no tests.
  lint:
    needs: image-publish
    if: github.event_name != 'schedule'
    # The runner's release only matters to `wasm` and to what runs on the
    # host's Docker; the pixel references come from the CI image's packages.
    runs-on: ubuntu-24.04
    # A hang fails instead of holding the runner for GitHub's default 6 h.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          free-disk: "false"
      - run: scripts/container/run.sh cargo fmt --all --check
      - run: scripts/container/run.sh cargo clippy --workspace --all-targets
      # niri's IPC (design.md, "Risks") and PipeWire audio (libpipewire)
      # sit behind default-on features; the build without them must stay
      # clean too.
      - run: scripts/container/run.sh cargo clippy -p strand-services --no-default-features --all-targets
      # The CPU core without the GPU backend (no wgpu, vello_gpu, naga or
      # libwayland-client; the CPU-only `.text` gate's build).
      - run: scripts/container/run.sh cargo clippy -p strand --no-default-features --all-targets
      - run: scripts/container/run.sh cargo build -p strand --no-default-features
      # Targets behind a non-default feature (strand's `[[test]] lock`
      # needs `faults`, and so does run/lock.rs's fault module) are out
      # of the default build: lint them too.
      - run: scripts/container/run.sh cargo clippy --workspace --all-targets --all-features
      # The committed parser.c and grammar.json match grammar.js
      # (docs/architecture.md, "tree-sitter layout"; no grammar yet
      # passes).
      - run: scripts/container/run.sh scripts/check-tree-sitter.sh
      # The CI scripts' own tests: gate-misses.sh (the advisory timing
      # gates), check-tree-sitter.sh, the budgets ledger line and the static
      # checks of the owner-only gpu-measure.sh (never run here),
      # size-report.sh's crate attribution, tests-ran.sh (a filtered
      # test step that runs no test fails), strand's build script leaving
      # git's index alone (its write made the next step rebuild the
      # binary), the job summary of the nextest run and the static half of
      # its filters' check, the stress and validation runs' summaries, the
      # nightly-red issue, the Arch pin's date,
      # affected.sh's choice of
      # crates (the laptop's inner loop, CLAUDE.md), prune-rust-caches.sh
      # (the nightly cache pruning) and check-path-filters.sh, which then holds the lock-vm and package
      # jobs' path filters to the tree: an entry naming a moved file would
      # silently stop that job running for it; image.sh, publish-image.sh and
      # what run.sh passes, on a stand-in docker; then, on the runner's real
      # one, that ci.yml's top env reaches the container.
      - run: scripts/container/run.sh scripts/container/test-gate-misses.sh
      - run: scripts/container/run.sh scripts/container/test-check-tree-sitter.sh
      - run: scripts/container/run.sh scripts/container/test-ledger.sh
      - run: scripts/container/run.sh scripts/container/test-gpu-measure.sh
      - run: scripts/container/run.sh scripts/test-size-report.sh
      - run: scripts/container/run.sh scripts/container/test-tests-ran.sh
      - run: scripts/container/run.sh scripts/container/test-build-script-index.sh
      - run: scripts/container/run.sh scripts/container/test-nextest-summary.sh
      - run: scripts/container/run.sh scripts/container/test-nextest-filters.sh
      - run: scripts/container/run.sh scripts/container/test-stress-summary.sh
      - run: scripts/container/run.sh scripts/container/test-nightly-red.sh
      - run: scripts/container/run.sh scripts/container/test-validation-summary.sh
      - run: scripts/container/run.sh scripts/container/test-matrix-pin.sh
      - run: scripts/container/run.sh scripts/container/test-affected.sh
      - run: scripts/container/run.sh scripts/container/test-prune-rust-caches.sh
      - run: scripts/container/run.sh scripts/container/test-check-path-filters.sh
      - run: scripts/container/run.sh scripts/container/check-path-filters.sh
      - run: scripts/container/run.sh scripts/container/test-image.sh
      - run: scripts/container/test-run-env.sh

  # The debug test build: the workspace's tests through cargo-nextest, the
  # doc-tests, the 100 reloads and the reload fuzzer's short run.
  test:
    needs: image-publish
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: scripts/container/run.sh cargo test -p strand-services --no-default-features --lib
      # The workspace's tests through cargo-nextest, each in a process of its
      # own and side by side across binaries (.config/nextest.toml; decisions.md
      # robustness has the measurements behind -j). The reload fuzzer runs on
      # its own below (timing-sensitive saves), and the 100 reloads too. The
      # job summary gets the counts and names each flaky test.
      - run: scripts/container/run.sh scripts/container/workspace-tests.sh -j 6
      # A filter of .config/nextest.toml matching no test fails, and so does a
      # retry reaching what may not have one.
      - run: scripts/container/run.sh scripts/container/nextest-filters.sh
      # Nextest doesn't run doc-tests.
      - run: scripts/container/run.sh cargo test --doc --workspace
      # strand-auth's PAM tier and its no-faults check need the helper's
      # test hooks, asked for by name: no plain test build turns them on.
      - run: scripts/container/run.sh cargo test -p strand-auth --features faults
      # A presented surface under frames that send nothing. Alone, since
      # `--workspace` turns on the `eval` crate's `eval-hooks` in strand-render,
      # which draws every frame, so that build never sees this path.
      - run: scripts/container/run.sh cargo test -p strand --test presented_quiet
        timeout-minutes: 10
      # M3 exit, "100 reloads with no reconnects": a shell reading every
      # builtin service but screens and auth (python-dbusmock's daemons,
      # a mock portal, a tray item and an MPRIS player on a private bus,
      # sway's IPC, a private PipeWire), 100 token, markup and binding
      # edits through `strand run`'s watcher: no service restarted (start
      # log), no bus connection but the from-dbus introspection refresh
      # (bus monitor), no mock called, the same sockets, no sway IPC
      # accept (sway -d log), no new PipeWire object of strand's (pw-mon),
      # no state reset; then a negative control (a changed custom service
      # restarts alone).
      # It takes under a minute; its own watchdog prints the stage and
      # the logs and aborts after 5 min, this bound backs it.
      - run: scripts/container/run.sh cargo test -p strand --test reloads -- --nocapture
        timeout-minutes: 10
      # The reload fuzzer's short run: 60 edits through the five save
      # styles and the sway pipeline, on tmpfs, alone (a descheduled test
      # thread splits a delete-and-create save; a gap of at most 20 ms,
      # still past the 15 ms coalescing, leaves it 30 ms of the watcher's
      # 50 ms grace).
      - run: scripts/container/run.sh scripts/container/tests-ran.sh cargo test -p strand --lib random_edits_through_five_save_styles -- --nocapture --test-threads=1
        env:
          STRAND_FUZZ_MAX_GAP_MS: "20"
      # A failed acceptance test's sway.log, timed.log and strand.log
      # (target/acceptance/logs/<tag>/): the debug run in this job is the one
      # that fails under load, and the runner goes with them.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-acceptance-logs
          path: target/acceptance/
          if-no-files-found: ignore

  # The memory gates, on the real release profile: its per-package
  # opt-levels are what the budgets rest on (crates/strand/tests/
  # budgets.rs checks them).
  budgets:
    needs: image-publish
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # One dependency cache for both release jobs; acceptance saves it.
      - uses: ./.github/actions/setup
        with:
          cache-key: release
          cache-save: "false"
      # The three test binaries and `strand` in one build, so they link side
      # by side; the gated binary's fat LTO link happens once. The package job
      # builds another program with other features (decisions.md ci-speed-2).
      - run: scripts/container/run.sh cargo test --release -p strand --test demo --test services --test budgets --no-run
      # The bar's PSS budget (42 MB target warns, 48 MB ceiling fails, GPU cold: no render node, no software adapter accepted, decisions.md gpu-first) is checked on a release build (design.md, "Testing": budgets).
      - run: scripts/container/run.sh cargo test --release -p strand --test demo
      # The same gate and the idle budget on the real services (private
      # bus, mock portal): `the_real_services_sleep_when_nothing_changes`.
      - run: scripts/container/run.sh cargo test --release -p strand --test services -- --test-threads=1
      # M3 exit, "memory verified": design.md's bar on two 2560x1440
      # outputs reading battery, network, audio, workspaces, windows,
      # tray and notifications on the real backends (python-dbusmock's
      # UPower, NetworkManager and logind and a mock portal on a private
      # bus, the shell's own notifications server and tray host, sway's
      # IPC, a private PipeWire) within the PSS budget with the warm
      # lavapipe device (242 MiB target warns, 252 MiB ceiling fails) and
      # GPU cold (42 / 48 MB, nothing Vulkan mapped) with no huge
      # page, then 10 s without a wakeup or a frame; and the full shell
      # (launcher open at 2x, two toasts, the OSD) printed against
      # 296 / 324 MiB warm and 76 MB / 128 MiB cold, decisions.md
      # m5-open-budgets, seam-snap and gpu-first (the warm device).
      - run: scripts/container/run.sh cargo test --release -p strand --test budgets -- --nocapture --test-threads=1
        env:
          STRAND_LEDGER_FILE: ${{ runner.temp }}/ledger
      # M5's size ledger line (scripts/container/ledger.sh): the GPU
      # build's .text against its gate and M4's baseline, in the log and
      # the job summary; the CPU-only half is acceptance's.
      - name: Size ledger
        if: always()
        run: scripts/container/ledger.sh "$RUNNER_TEMP/ledger"

  # M2 exit: design.md's four example shells and theme.strand, byte for
  # byte, in `strand run` on headless sway with two outputs against the
  # deterministic mock services, driven by clicks, the wheel, keys,
  # `strand set` and mock service changes; settled screenshots compared
  # with crates/strand/tests/refs/acceptance. Release, so frames of the
  # slides and swaps are caught (the test job runs them in debug without
  # those).
  acceptance:
    needs: image-publish
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The release dependency cache budgets restores too: this job builds
      # both feature sets, so it is the one that saves it.
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - run: scripts/container/run.sh cargo test --release -p strand --test acceptance -- --nocapture --test-threads=1
      # The CPU core's .text keeps its own gate (24,903,680 B; the GPU
      # backend's is 29,097,984 B), both re-based on wave-cost's
      # tree with a 512 KiB reserve (decisions.md growth, services-round, wave-cost;
      # docs/architecture.md, "`strand-gpu`"). Here rather than in budgets,
      # whose last step it was and whose run it lengthened by its 6 min
      # fat-LTO build (decisions.md audit-cpu-gate-move).
      - run: scripts/container/run.sh scripts/container/tests-ran.sh cargo test --release -p strand --no-default-features --test budgets the_release_binary_code_stays_within_its_gate -- --nocapture
        env:
          STRAND_LEDGER_FILE: ${{ runner.temp }}/ledger
      # The CPU-only half of M5's size ledger line (budgets prints the GPU's).
      - name: Size ledger
        if: always()
        run: scripts/container/ledger.sh "$RUNNER_TEMP/ledger"
      # A screenshot that missed its reference, with its diff, and a failed
      # test's sway.log and timed.log (target/acceptance/logs/<tag>/).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: acceptance-shots
          path: target/acceptance/
          if-no-files-found: ignore

  # The timing gates, on the `timing` profile (Cargo.toml): release's
  # opt-levels without its link-time optimisation, which they do not
  # measure.
  timing:
    needs: image-publish
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # A theme swap within design.md's 5 ms of work (logic's re-resolve,
      # the render thread's springs and contrast check, the token graph
      # of every frame) on an optimised build.
      - run: scripts/container/run.sh cargo test --profile timing -p strand-render --test theme_swap_bench -- --nocapture
      # Save → pixels p95 within design.md's 35 ms (token) and 50 ms
      # (markup) on an optimised build, to the painted buffer and to the
      # frame sway presents, and a monitor or portal change (a mock
      # portal's SettingChanged on a private bus) on the next frame;
      # ignored in debug builds.
      # 50 edits each so p95 is not the worst of 20 samples (the token
      # gate's headroom is thin: 1.6 ms at p95 in GitHub run 37647946808,
      # 0.5 ms in a reviewer's local run).
      - run: scripts/container/run.sh scripts/container/tests-ran.sh cargo test --profile timing -p strand --lib reload_latency -- --nocapture --test-threads=1
        env:
          STRAND_LATENCY_ROUNDS: "50"
      # M4 exit "smooth 2,000-row scrolling": a 2,000-row list's render
      # frame p95 within 3.5 ms at 60 and 144 Hz on an optimised build,
      # with logic's window answers 50 ms late and no stalled frame
      # (decisions.md m4-lists-w1).
      - run: scripts/container/run.sh cargo test --profile timing -p strand-render --test list_scroll_bench -- --nocapture
      # The launcher's enter and a toast's exit: every frame within a
      # 60 Hz refresh and the median within half of it, on an optimised
      # build (features.md, M2's motion box).
      - run: scripts/container/run.sh scripts/container/tests-ran.sh cargo test --profile timing -p strand-render --test motion animated_frames_fit_the_refresh_budget -- --nocapture
      # The owner's notch card (1470 × 708 at scale 1.5) swelling and
      # folding: the median frame within half a 60 Hz refresh and every
      # frame within one, on an optimised build (owner-testing.md bug 17).
      - run: scripts/container/run.sh scripts/container/tests-ran.sh cargo test --profile timing -p strand-render --test morph the_island_card_swells_within_the_frame_budget -- --nocapture
      # The animation review's CPU wins (decisions.md perf-gates): the
      # cover's mask, the transformed gradients of a shared morph and a
      # staggered grid, a list scrolled and a palette spring, each run's
      # median frame within a 120 Hz refresh and its p95 within a 60 Hz
      # one, and where the win was the encoding, its mean within 1 ms.
      - run: scripts/container/run.sh scripts/container/tests-ran.sh cargo test --profile timing -p strand-render --test anim_bench animated_cpu_frames_hold_their_gates -- --nocapture --test-threads=1
      # The logic side of a theme swap (design.md's theme.strand, from
      # the write of `theme.look` to `SetTokens`) within design.md's
      # 5 ms by the median of 15 swaps, on an optimised build.
      - run: scripts/container/run.sh scripts/container/tests-ran.sh cargo test --profile timing -p strand-compiler --test theme a_theme_swap_is_under_five_milliseconds_of_logic -- --nocapture

  # The animation evaluation sandbox (eval/, docs/eval.md): its own Cargo
  # workspace, so none of the jobs above builds it. scripts/eval/ci.sh's
  # steps: fmt and clippy of strand-eval, its lock and isolation
  # checks with their self-tests, its tests (the GPU leg on lavapipe, as
  # the GPU tier) and test-report-view.sh on fixture bundles,
  # `strand-eval refs-check` (the reference recordings)
  # and `check --gate` over the curated, regression and docs scenarios
  # (the site's examples and their dark twins), each held to its approved
  # reference; the gate appends its summary to the
  # job's; the effect matrix; and (report) a glitch report replayed end
  # to end (test-report-view.sh --e2e: `strand run` on headless sway, a
  # scripted session, `strand report`, the replay held to the live
  # shell), which builds strand's report test too, hence 50 minutes. The
  # mutants run nightly (eval-matrix.yml).
  eval:
    needs: image-publish
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      # Full history: refs-check holds a reference changed since the
      # merge base with main to an updated note (scripts/eval/ci.sh step 5).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: eval
      - run: scripts/container/run.sh scripts/eval/ci.sh
      # The report: every scenario's trace, checks, frames and viewer, the
      # matrix's grid and summary (a changed cell is approved from a local
      # run, scripts/container/run.sh eval matrix-all), and under
      # target/eval/ci/report-view-failed/ the live and replayed frames of a
      # glitch report session that failed (test-report-view.sh --e2e).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: |
            target/eval/ci/
            target/eval/matrix-ci/index.html
            target/eval/matrix-ci/matrix.json
            target/eval/matrix-ci/summary.md
          if-no-files-found: ignore

  # The documentation site (crates/strand-site; docs/architecture.md,
  # "strand-site"): the build, which fails on any link, anchor, config,
  # claim, example or contrast it cannot vouch for, with its CLI page held
  # to the strand binary's own help; strand-site's tests; the examples'
  # media drawn again by eval from their scenarios and compared with the
  # committed ones, pixel for pixel (scripts/site/media.sh --check); and
  # every page in headless Chromium at three widths, light and dark, from
  # file:// with no network (scripts/site/shots.sh --all, eval's pinned
  # Playwright image, on the runner's Docker and not in the CI image, as
  # eval-matrix.yml's viewer check): a console error, a failed request, a page wider than the
  # screen or a search or player that does not work fails it.
  site:
    needs: image-publish
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: site
      - name: Build the site, its CLI page held to the strand binary
        run: |
          scripts/container/run.sh bash -c "cargo build -q -p strand --bin strand &&
            cargo run -q -p strand-site -- build --strand \$CARGO_TARGET_DIR/debug/strand"
      - run: scripts/container/run.sh cargo test -p strand-site
      - run: scripts/container/run.sh env SITE_DIRECT=1 bash scripts/site/media.sh --check
      - run: scripts/site/shots.sh --all
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site
          path: |
            target/site/
            target/site-shots/
          if-no-files-found: ignore

  # The site's live examples (docs/live-examples.md): the render path
  # linted for wasm32-unknown-unknown (no call to std's clock, which
  # panics in a browser: scripts/wasm/lint.sh), strand-web built with
  # vello_cpu's multiply-adds fused as natively (scripts/wasm/exact-fma.py)
  # and held to its size budget (2.5 MB brotli, a tripwire), the site built and the build added to it
  # (scripts/wasm/site.sh), and every docs example run live in headless
  # Chromium, no network, its frames held to the frames eval drew for
  # the site, pixel for pixel, in both modes (scripts/wasm/check-browser.sh,
  # eval's pinned Playwright image on the runner's Docker). The artifact
  # `site-live` is the site to publish: target/site with its wasm/.
  # The tools are scripts/wasm/Dockerfile's, at the same versions:
  # wasm-bindgen-cli matching the crate in Cargo.lock, binaryen 124.
  # The one job left on the runner, with its build headers from apt: the
  # image has no wasm target or tools, and an image of scripts/wasm/Dockerfile
  # would be built per run or published beside it (decisions.md ci-speed-2).
  wasm:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      WASM_BINDGEN_VERSION: 0.2.129
      BINARYEN_VERSION: "124"
      BINARYEN_SHA256: 0290c3779fedf592b8da0ded3032ff55c41a2b7bfa2d6bf7b7bac6f0e6e28963
      # getrandom 0.3's browser backend (scripts/wasm/run.sh sets the same).
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: --cfg getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          tier: headers
          cache-key: wasm
      - name: The wasm target, wasm-bindgen-cli, wasm-opt, brotli and the icons
        run: |
          rustup target add wasm32-unknown-unknown
          grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep -q "version = \"$WASM_BINDGEN_VERSION\"" \
            || { echo "::error::Cargo.lock's wasm-bindgen is not $WASM_BINDGEN_VERSION: bump it here and in scripts/wasm/Dockerfile"; exit 1; }
          sudo apt-get install -y --no-install-recommends brotli adwaita-icon-theme
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  /tmp/binaryen.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/binaryen.tar.gz -C /opt
          echo "/opt/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        id: bindgen
        with:
          path: ~/.cargo-tools/wasm-bindgen
          key: wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-rust-1.97.0
      - name: wasm-bindgen-cli
        run: |
          if [ "${{ steps.bindgen.outputs.cache-hit }}" != true ]; then
            cargo install --locked --root ~/.cargo-tools/wasm-bindgen wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          fi
          echo "$HOME/.cargo-tools/wasm-bindgen/bin" >> "$GITHUB_PATH"
      - name: Lint, build and size the live examples
        run: |
          wasm-opt --version
          wasm-bindgen --version
          bash scripts/wasm/build.sh
      - name: Build the site and add the live examples
        run: |
          cargo run -q -p strand-site -- build
          bash scripts/wasm/site.sh
      - run: scripts/wasm/check-browser.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-live
          path: |
            target/site/
            target/site-shots/live/
            target/wasm/pkg/sizes.json
          if-no-files-found: ignore

  # M3 exit: "runs on Hyprland, niri and sway". The stores and design.md's
  # bar in `strand run` against each live compositor, compared with what
  # its own CLI reports (crates/strand/tests/compositor_matrix.rs, run by
  # scripts/compositor-matrix.sh). Hyprland and niri are packaged on Arch,
  # not on the Ubuntu runner: the test is built in the CI image and run in
  # the pinned Arch image of Dockerfile.matrix, as scripts/container/matrix.sh
  # does, so a compositor's release can't break an unrelated push. Hyprland's aquamarine allocates on a DRM
  # node even for headless outputs, so the runner loads vkms (a virtual
  # KMS card, rendered by Mesa's llvmpipe) and passes it in; niri runs
  # nested (winit) in a headless sway; sway runs headless.
  # At night and on a dispatch it runs archlinux:latest instead, which installs
  # the current Hyprland, niri, sway and labwc, so an upstream release that
  # breaks an adapter fails here within a day without a push, and holds the
  # pin to its age (scripts/container/matrix-pin.sh). A failure names the
  # compositor and its package version (an annotation and the job
  # summary; decisions.md laptop-resilience).
  compositors:
    needs: image-publish
    name: "${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'compositors (nightly: archlinux:latest Hyprland, niri, sway, labwc)' || 'compositors' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          free-disk: "false"
          cache-key: compositors
      - name: Build the compositor matrix test
        id: build
        run: |
          # The binary's path from cargo's JSON messages: the human
          # "Executable" line carries colour codes under CARGO_TERM_COLOR.
          # The same path inside and outside the container.
          scripts/container/run.sh cargo test -p strand --test compositor_matrix --no-run --message-format=json >build.json
          test=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "compositor_matrix" and .executable != null) | .executable' build.json | tail -1)
          echo "matrix test: $test"
          test -x "$test"
          echo "test=$test" >>"$GITHUB_OUTPUT"
      - name: A virtual KMS card (vkms)
        id: drm
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" || echo "no linux-modules-extra-$(uname -r); trying the modules present"
          before=$(ls -d /sys/class/drm/card* 2>/dev/null || true)
          sudo modprobe vkms
          sudo udevadm settle || true
          ls -l /dev/dri
          card=
          for c in /sys/class/drm/card*; do
            name=$(basename "$c")
            case "$name" in *-*) continue ;; esac
            echo "$before" | grep -qx "$c" && continue
            card=/dev/dri/$name
          done
          [ -n "$card" ] || { echo "::error::no card appeared for vkms"; exit 1; }
          echo "vkms card: $card"
          echo "card=$card" >>"$GITHUB_OUTPUT"
      - name: sway, niri, Hyprland and labwc (pinned; at night, today's packages)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            schedule | workflow_dispatch) image=archlinux:latest ;;
            *) image=$(STRAND_IMAGE_FILE=Dockerfile.matrix scripts/container/image.sh) ;;
          esac
          docker run --rm --device /dev/dri -v "$PWD:$PWD" -w "$PWD" \
            -e STRAND_DRM_CARD=${{ steps.drm.outputs.card }} \
            "$image" bash scripts/compositor-matrix-ci.sh "${{ steps.build.outputs.test }}"
      - name: The pin's age
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          MATRIX_PIN_NOTE: target/pin-age.md
        run: scripts/container/matrix-pin.sh check
      # Each compositor's package version and result, on the run's page.
      - name: Compositor versions and results
        if: always()
        run: cat target/matrix/summary.md >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compositor-matrix
          path: target/matrix/
          if-no-files-found: ignore
      # What a red night's issue quotes: which compositor and package, the pin's age.
      - uses: actions/upload-artifact@v7
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: nightly-summary-compositors
          path: target/matrix/summary.md
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: nightly-summary-pin
          path: target/pin-age.md
          if-no-files-found: ignore

  # The lock screen's VM tier (design.md, "Testing": a real PAM stack in
  # a QEMU VM "before touching the lock code, and before releases"):
  # scripts/container/lockvm.sh, as on the laptop. GitHub's standard
  # Linux runners expose /dev/kvm (hardware-accelerated Android
  # virtualization, 2024-04-02) once a udev rule opens it; that sudo
  # step runs on the runner only, never in the container scripts. A
  # runner without /dev/kvm fails here instead of emulating. Runs
  # nightly, on demand, on tags, on every push to main (release and
  # deploy need it, and a diff against the previous push would let a red
  # lock tier be followed by a green one; audit-lock-main) and on other
  # pushes and pull requests that touch the lock code or the harness.
  # (lockmon review) Its image's polkit 127 stage takes polkit's tag
  # archive and meson's sdist, both sha256-pinned (Dockerfile.lockvm), so
  # a cold build here runs nothing unpinned; a tag archive GitHub
  # regenerates fails with a message saying so.
  lock-vm:
    needs: image-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Lock paths changed
        id: paths
        if: (github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main') || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            lock:
              # S-lock's files as the M4 critique's ownership table names
              # them; the globs also catch them if they land elsewhere in a
              # crate. Keep this list in step with the lock code.
              - 'crates/strand-auth/**'
              - 'crates/**/*session_lock*'
              # Lock logic in shared surface-manager files that only the
              # lock VM exercises: the deferred configure ack and no bare
              # commit on `Role::Lock` (commit.rs), the pixel surfaces'
              # keyboard focus (seat.rs), lock routing in
              # `apply_surface_change`/`reconcile` (mod.rs), no popup on a
              # lock surface (popup.rs).
              - 'crates/strand-surface/src/manager/commit.rs'
              - 'crates/strand-surface/src/manager/seat.rs'
              - 'crates/strand-surface/src/manager/mod.rs'
              - 'crates/strand-surface/src/manager/popup.rs'
              # (lockmon review) A lock content's idle inhibitor, made at
              # its first commit (a lock VM test pins it).
              - 'crates/strand-surface/src/manager/idle.rs'
              # A lock surface takes no pose and no selection; the
              # registry's session lock manager decides whether there is a
              # lock at all.
              - 'crates/strand-surface/src/manager/pose.rs'
              - 'crates/strand-surface/src/selection.rs'
              - 'crates/strand-surface/src/caps.rs'
              # (lock-gpu) A lock surface's hand-off to the GPU thread, its
              # renewal on the CPU, and the binary's side of both (the
              # bound, the `gpu_stall` fault).
              - 'crates/strand-surface/src/gpu_handoff.rs'
              - 'crates/strand/src/run/gpu.rs'
              # (lock-gpu review) A destroyed lock surface's role goes at
              # once (`drop_role` in `destroy_surface`), which a renewal
              # needs (`duplicate_output` otherwise); render's pin and its
              # refusal of a lock's promotion; the GPU thread that attaches
              # and presents a lock surface (its swapchain, its stall).
              - 'crates/strand-surface/src/manager/layer.rs'
              - 'crates/strand-render/src/promote.rs'
              - 'crates/strand-render/src/renderer/backend.rs'
              - 'crates/strand-gpu/src/present.rs'
              - 'crates/strand-gpu/src/thread.rs'
              - 'crates/strand-gpu/src/device.rs'
              - 'crates/**/*lock_fallback*'
              # The glob stops at a directory's name: the fallback's font.
              - 'crates/strand-render/src/lock_fallback/**'
              - 'crates/strand/src/run/lock.rs'
              # The main loop's lock gating (Guard::check, signals and
              # logic ending held while locked), the heartbeat, lock
              # faults and password redaction on the logic thread.
              - 'crates/strand/src/run/mod.rs'
              - 'crates/strand/src/run/shell.rs'
              - 'crates/strand/src/run/logic.rs'
              # The `faults` feature the VM build turns on.
              - 'crates/strand/Cargo.toml'
              # The fallback's painting and keys in the binary's host.
              - 'crates/strand/src/demo/host.rs'
              # (lockmon) The pre-lock screen stills, taken in
              # `before_lock` while the lock request waits.
              - 'crates/strand/src/run/feeds.rs'
              - 'crates/strand/tests/lock.rs'
              - 'crates/strand/tests/lock/**'
              # Lock solids: single-pixel buffers and the shm fallback.
              - 'crates/strand-surface/src/solid.rs'
              - 'crates/strand-surface/src/manager/scrim.rs'
              - 'crates/strand-services/src/auth.rs'
              - 'crates/strand-services/tests/auth.rs'
              - 'crates/strand-services-schema/src/auth.schema'
              # (services-round) The polkit agent and the greeter, which
              # the lock VM runs against the real polkitd and greetd.
              - 'crates/strand-services/src/polkit/**'
              - 'crates/strand-services/src/greetd.rs'
              - 'crates/strand-services/tests/vm_auth.rs'
              - 'crates/strand-services-schema/src/polkit.schema'
              - 'crates/strand-services-schema/src/greetd.schema'
              - 'crates/strand-compiler/src/check/lock.rs'
              # The lock's runtime rules: only an auth token unlocks,
              # `open` held while locked, the write-back after Unlocked;
              # (lockmon) the lock's own logic run once, its instances'
              # twin keys. The mount of a lock's instances (mount.rs) and
              # render's twin routing (input.rs) change with most rounds
              # and are not listed: the compiler's surfaces.rs and
              # render's input tests pin them in every run.
              - 'crates/strand-compiler/src/instantiate/lock.rs'
              - 'scripts/lockvm/**'
              - 'scripts/container/*lockvm*'
              - 'scripts/container/lockvm/**'
              # This job's definition and the machine it starts from.
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
              - 'scripts/container/Dockerfile'
              - 'scripts/container/image.sh'
              - 'scripts/container/machine.sh'
              - 'scripts/container/run.sh'
      - name: Decide
        id: run
        run: |
          case "${{ github.event_name }}:${{ github.ref_type }}:${{ github.ref }}:${{ steps.paths.outputs.lock }}" in
            schedule:* | workflow_dispatch:* | push:tag:* | push:branch:refs/heads/main:* | *:true) echo "go=true" >>"$GITHUB_OUTPUT" ;;
            *) echo "go=false" >>"$GITHUB_OUTPUT"; echo "no lock paths changed: the lock VM tier is skipped" ;;
          esac
      - name: KVM for the runner's user
        if: steps.run.outputs.go == 'true'
        run: |
          ls -l /dev/kvm || { echo "::error::this runner has no /dev/kvm"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          ls -l /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm || { echo "::error::/dev/kvm is not read-writable"; exit 1; }
      # S-lock's scenarios (scripts/lockvm/scenarios/all.sh): the session
      # lock on headless sway, the strand binary's fault matrix (built
      # with `--features faults`) and the shipping helper against real
      # pam_unix, (services-round) the polkit agent against polkitd and
      # the greeter against greetd, built here in the CI image (the
      # guest is its Ubuntu release). (lockmon) The polkit agent runs twice:
      # against Ubuntu's polkit 124 and its setuid helper, and against
      # polkit 127, which Dockerfile.lockvm builds from its release
      # tarball (sha256-pinned; meson 1.4.2 from PyPI) into /opt/polkit127,
      # and its helper behind
      # /run/polkit/agent-helper.socket; the image build takes a minute
      # or two longer for it.
      # The test job's dependencies, read only: with no key of its own
      # saved, this job built them cold (decisions.md ci-speed-2).
      - uses: ./.github/actions/setup
        if: steps.run.outputs.go == 'true'
        with:
          cache-key: test
          cache-save: "false"
      - name: Build the lock VM scenarios' binaries
        if: steps.run.outputs.go == 'true'
        run: scripts/container/run.sh bash scripts/lockvm/scenarios/build.sh
      - name: Lock VM scenarios
        if: steps.run.outputs.go == 'true'
        run: scripts/container/lockvm.sh bash scripts/lockvm/scenarios/all.sh
        env:
          # (lock-4k) The desk tests brought the scenarios to about ten
          # minutes on GitHub's runner; the guest's bound is generous.
          LOCKVM_TIMEOUT: "1200"

  # (install) The release archive the installer installs
  # (scripts/release/package.sh; site/start/install.md): release builds
  # of strand, strand-auth, strand-dev and strand-eval, held to the
  # installer's glibc, with every crate's license (cargo-about; a license
  # scripts/release/about.toml does not accept fails it); then
  # scripts/install.sh installing, updating and removing it in fresh
  # Ubuntu 24.04 and Arch containers and refusing Ubuntu 22.04 and a
  # system without the libraries (scripts/release/smoke.sh, on the
  # runner's Docker). The release job publishes the `strand-dist`
  # artifact; edge-<commit> names it, or the version on a tag.
  # On a push to main, a tag and a dispatch it always runs, and deploy
  # and release run only there, so they always have its real output. On
  # other branch pushes and on pull requests it runs when anything that
  # goes into the archive changed, all source included, since main moves on
  # what the branch's run proved; it passes with nothing done otherwise,
  # for a change only to docs, the site or other scripts (the same shape
  # as lock-vm; decisions.md ci-speed-2).
  package:
    needs: image-publish
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Not CARGO_-anything: rust-cache hashes every variable named CARGO*
      # into its key, and one here gave this job a key no job saves, so
      # it built cold, the `release` cache below unread (decisions.md
      # ci-speed-2).
      ABOUT_VERSION: 0.9.3
    steps:
      - uses: actions/checkout@v7
      - name: Package inputs changed
        id: paths
        if: (github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main') || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            package:
              # This job, the machine it starts from, and the build
              # settings package.sh's four programs come out of.
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
              - 'scripts/container/Dockerfile'
              - 'scripts/container/image.sh'
              - 'scripts/container/machine.sh'
              - 'scripts/container/run.sh'
              - '.cargo/config.toml'
              # package.sh, smoke.sh, test-install.sh, test-publish.sh,
              # publish.sh, licenses.py, about.toml and the installer.
              - 'scripts/release/**'
              - 'scripts/install.sh'
              # What the build resolves and what cargo-about reads.
              - 'Cargo.lock'
              - 'Cargo.toml'
              # Every source of the four programs and of what test-install.sh
              # runs in the installed tree: a compiler change can make `strand
              # check` reject its config, any source can raise the glibc floor
              # or warn only in release.
              - 'crates/**'
              - 'eval/**'
              # The archive's own files.
              - 'LICENSE-APACHE'
              - 'LICENSE-MIT'
              # `strand new`'s template, compiled in from outside crates/.
              - 'docs/guide/template/bar.strand'
      # Skips only when the filter ran and said no: on main, a tag or a
      # dispatch it does not run, so nothing here can skip them.
      - name: Decide
        id: run
        env:
          FILTER: ${{ steps.paths.outcome }}
          CHANGED: ${{ steps.paths.outputs.package }}
        run: |
          if [ "$FILTER" = success ] && [ "$CHANGED" = false ]; then
            echo "go=false" >>"$GITHUB_OUTPUT"
            echo "no package inputs changed: the package job is skipped"
          else
            echo "go=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.run.outputs.go == 'true'
        with:
          cache-key: release
          cache-save: "false"
      # As scripts/release/ci.sh: built in the image, kept in its target.
      - uses: actions/cache@v6
        if: steps.run.outputs.go == 'true'
        id: about
        with:
          path: target/container/tools
          key: cargo-about-${{ env.ABOUT_VERSION }}-rust-1.97.0-image
      - name: cargo-about
        if: steps.run.outputs.go == 'true' && steps.about.outputs.cache-hit != 'true'
        run: |
          scripts/container/run.sh cargo install --locked --root target/container/tools cargo-about --version "$ABOUT_VERSION" --features cli
      - name: The archive's version
        if: steps.run.outputs.go == 'true'
        id: id
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "id=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "id=edge-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      # A tag's name may hold shell syntax: it stays an argument throughout.
      - env:
          ARCHIVE_ID: ${{ steps.id.outputs.id }}
        run: |
          # shellcheck disable=SC2016
          scripts/container/run.sh bash -c 'PATH=$PWD/target/container/tools/bin:$PATH scripts/release/package.sh "$1" "$2"' bash "$ARCHIVE_ID" "$RUNNER_TEMP/dist"
        if: steps.run.outputs.go == 'true'
      - run: scripts/container/run.sh scripts/release/test-publish.sh
        if: steps.run.outputs.go == 'true'
      - run: scripts/release/smoke.sh "$RUNNER_TEMP/dist"
        if: steps.run.outputs.go == 'true'
      - uses: actions/upload-artifact@v7
        if: steps.run.outputs.go == 'true'
        with:
          name: strand-dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30

  # The docs site on Railway (deploy/railway/README.md): on a push to
  # main whose every job passed, the site the wasm job built and checked
  # (the `site-live` artifact) is packaged with deploy/railway's
  # Dockerfile and Caddyfile, its server checked (scripts/site/
  # package.sh --check), and uploaded with `railway up`, so Railway
  # builds nothing but that small image. It needs the repository secret
  # RAILWAY_TOKEN (a project token) and the variable RAILWAY_SERVICE;
  # with no token it says so and deploys nothing.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `package` too: the site serves scripts/install.sh, which it tests.
    needs: [lint, test, budgets, acceptance, timing, eval, site, wasm, compositors, lock-vm, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: railway-deploy
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      RAILWAY_CLI_VERSION: 5.67.1
      RAILWAY_CLI_SHA256: f65fcb7d9b97e81e9cc2c8af08cbdf57d3801579a727ec2302e5774965b0575e
    steps:
      # (audit-deploy-head) As publish.sh for edge: a run main has moved
      # on from (re-run, or finished late) deploys nothing, so an older
      # site and install.sh never replace a newer one.
      - name: Is there a token, and is main still here?
        id: token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::No RAILWAY_TOKEN secret: the site is not deployed (deploy/railway/README.md)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error::RAILWAY_TOKEN is set but the RAILWAY_SERVICE variable is not"
            exit 1
          else
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha) || exit 1
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::main is at ${head::12} now, not ${GITHUB_SHA::12}: that push's run deploys the site"
              echo "go=false" >> "$GITHUB_OUTPUT"
            else
              echo "go=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.go == 'true'
      - uses: actions/download-artifact@v8
        if: steps.token.outputs.go == 'true'
        with:
          name: site-live
          path: target/site-live
      - name: Package the site and check its server
        if: steps.token.outputs.go == 'true'
        run: scripts/site/package.sh --check target/site-live/site "$RUNNER_TEMP/railway"
      - name: The Railway CLI
        if: steps.token.outputs.go == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/railway.tar.gz \
            "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RAILWAY_CLI_SHA256}  /tmp/railway.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.railway-cli"
          tar -xzf /tmp/railway.tar.gz -C "$HOME/.railway-cli" railway
          echo "$HOME/.railway-cli" >> "$GITHUB_PATH"
      - name: Deploy
        if: steps.token.outputs.go == 'true'
        run: railway up "$RUNNER_TEMP/railway" --path-as-root --no-gitignore --service "$RAILWAY_SERVICE" --ci --message "${GITHUB_SHA::12}"

  # (install) The package job's archive on GitHub's releases
  # (scripts/release/publish.sh): a push to main whose every job passed
  # replaces the `edge` pre-release's build, unless main has moved on
  # since; a tag vX, which must name the workspace's version, becomes
  # the release vX. The only job whose token may write to the repository.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, test, budgets, acceptance, timing, eval, site, wasm, compositors, lock-vm, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: strand-dist
          path: ${{ runner.temp }}/dist
      - run: scripts/release/publish.sh "$RUNNER_TEMP/dist"
        env:
          GH_TOKEN: ${{ github.token }}

  nightly:
    needs: image-publish
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The M1 exit gate: 10,000 random edits, each saved in all five
      # editor styles into a live pipeline on tmpfs (/dev/shm), and in
      # place into the pipeline on headless sway. On the `timing`
      # profile, the latency run's build below.
      - run: scripts/container/run.sh scripts/container/tests-ran.sh cargo test --profile timing -p strand --lib random_edits_through_five_save_styles -- --nocapture
        env:
          STRAND_FUZZ_EDITS: "10000"
          # A new sequence each night; the seed is printed to replay it.
          STRAND_FUZZ_SEED: ${{ github.run_id }}
      # The same 10,000 edits on the instance level, and the state table,
      # on the same profile so the job builds one optimised tree.
      - run: scripts/container/run.sh scripts/container/tests-ran.sh cargo test --profile timing -p strand-compiler --test reload random_ -- --nocapture
        env:
          STRAND_RELOAD_FUZZ: "10000"
          STRAND_STATE_FUZZ: "2000"
      # The timing job's latency gate with 200 edits each.
      - run: scripts/container/run.sh scripts/container/tests-ran.sh cargo test --profile timing -p strand --lib reload_latency -- --nocapture --test-threads=1
        env:
          STRAND_LATENCY_ROUNDS: "200"

  # The tests over and over with no retry and the CPU deliberately short, to
  # learn which fail and how often before a push does (scripts/container/stress.sh;
  # decisions.md robustness): the tests the record says fail under load, and the
  # whole workspace one block in four, for the time in `stress_minutes`, which the
  # 270 minutes hold with the build and a block running over. The job summary
  # names each failure with its rate, and the logs go up as `stress-logs`. No push
  # waits on it: deploy and release name their jobs, and a push doesn't run this.
  # It is red when a test fails twice or more, or once by a crash or a timeout; a
  # test failing once is a warning with its rate. A red night files the issue below.
  stress:
    needs: image-publish
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v7
      # The test job's dependencies, read only, as lock-vm.
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          cache-save: "false"
      - run: scripts/container/run.sh scripts/container/stress.sh
        timeout-minutes: 260
        env:
          STRAND_STRESS_MINUTES: ${{ inputs.stress_minutes || '180' }}
          # A new order each night; the job prints it, to replay.
          STRAND_STRESS_SEED: ${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stress-logs
          path: |
            target/stress/
            target/acceptance/logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-summary-stress
          path: target/stress/summary.md
          if-no-files-found: ignore

  # The GPU tests with Khronos's validation layer on lavapipe, a validation error
  # failing the run, after proving that one does (scripts/container/validation.sh;
  # decisions.md robustness). Memory and wall-clock gates aren't among them, and a
  # pixel comparison doesn't hold in a process with the layer. The job summary has
  # the numbers, the logs go up as `validation-logs`.
  validation:
    needs: image-publish
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          cache-save: "false"
      - run: scripts/container/run.sh scripts/container/validation.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-logs
          path: target/validation/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-summary-validation
          path: target/validation/summary.md
          if-no-files-found: ignore

  # A red night, seen: one open issue labelled `nightly-red`, a comment on it per
  # red night (scripts/container/nightly-red.sh says why not GitHub's mail). What
  # runs only at night has no push to go red on. Runs on schedule, and on a
  # dispatch that asks. `image` and `image-publish` are watched too, since all the
  # others skip when they fail, and a job at its own timeout ends `cancelled`;
  # `!cancelled()` is false only for a whole run cancelled by hand, which files
  # nothing. eval-matrix.yml has the same job for its own night. The only jobs
  # whose token may write issues.
  nightly-red:
    needs: [image, image-publish, compositors, lock-vm, nightly, stress, validation, prune-caches]
    if: "!cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && (github.event_name == 'schedule' || inputs.report_red == 'true')"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: nightly-summary-*
          path: ${{ runner.temp }}/summaries
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARIES: ${{ runner.temp }}/summaries
        run: >-
          scripts/container/nightly-red.sh
          "image: ${{ needs.image.result }}"
          "image-publish: ${{ needs.image-publish.result }}"
          "compositors: ${{ needs.compositors.result }}"
          "lock-vm: ${{ needs.lock-vm.result }}"
          "nightly: ${{ needs.nightly.result }}"
          "stress: ${{ needs.stress.result }}"
          "validation: ${{ needs.validation.result }}"
          "prune-caches: ${{ needs.prune-caches.result }}"

  # The dependency caches, kept to one generation each: every new Cargo.lock
  # or manifest saves a new key beside the old one, which only fills the
  # 10 GB and pushes others out (scripts/container/prune-rust-caches.sh;
  # decisions.md ci-speed-2). The only job whose token may change caches. On
  # dispatch too, so a change to it can be proved from its branch.
  prune-caches:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: scripts/container/prune-rust-caches.sh
        env:
          GH_TOKEN: ${{ github.token }}
