[package]
name = "strand-dev"
description = "Developer tooling: LSP and inspector, kept out of the runtime binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `shaders`: the LSP checks `.wgsl` files too.
strand-compiler = { workspace = true, features = ["shaders"] }
# The services' schemas (not their runtime): `strand-dev lsp` checks,
# hovers and completes against the services `strand run` serves.
strand-services-schema.workspace = true
# `from dbus` services checked against D-Bus introspection (zbus alone,
# not the services runtime: decisions.md, wave4-a3).
strand-introspect.workspace = true
# `strand-dev inspect` speaks the shell's socket protocol.
strand-core.workspace = true
# Write-back checks a file against the running shell's BLAKE3 hash of it.
blake3 = "1.8.7"
crossbeam-channel = "0.5.17"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = "1.0.151"

[dev-dependencies]
# `tests/guide.rs` resolves the control centre's tokens as render does,
# and reads level 5's `from file` samples with the services' parser.
strand-scene.workspace = true
strand-services.workspace = true
# `tests/guide.rs` places drops on level 5's dock with render's router,
# on the scene laid out as `strand run` lays it out.
strand-render.workspace = true
strand-text.workspace = true
# `tests/tree_sitter.rs` holds the editor grammar to the compiler's parser;
# the grammar is linked into no binary (docs/architecture.md, "tree-sitter
# layout").
tree-sitter = "0.27.0"
tree-sitter-strand = { path = "tree-sitter-strand" }

[lints]
workspace = true
