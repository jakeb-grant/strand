[package]
name = "strand-surface"
description = "Surface manager: layer-shell, poses, blur, input, frame timing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["gpu"]
# Raw Wayland handles for the GPU's WSI (`gpu_handoff.rs`): libwayland's
# `client_system` backend for every crate in the build (57 kB of
# `.text`), and raw-window-handle.
gpu = ["dep:raw-window-handle", "dep:wayland-backend", "wayland-backend/client_system"]

[dependencies]
strand-scene.workspace = true
raw-window-handle = { version = "0.6.2", optional = true }
wayland-backend = { version = "0.3.17", optional = true }
# The session lock's unlock gate: `State::unlock` takes an `UnlockToken`
# (the lib only: libc and zeroize; the helper alone links libpam).
strand-auth.workspace = true
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
calloop = "0.14.5"
log = "0.4"
rustix = { version = "1.1.5", features = ["time"] }

[dev-dependencies]
# A fake compositor for what sway 1.9 lacks (the alpha modifier, the
# background effect).
strand-fake-wayland = { path = "../strand-fake-wayland" }
png = "0.18.1"
rustix = { version = "1.1.5", features = ["process"] }
strand-render.workspace = true
strand-text.workspace = true
# tests/session_lock_finished.rs: a fake compositor for the lock paths
# sway 1.9 cannot drive.
wayland-server = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "server", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client", "server"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }

[lints]
workspace = true
