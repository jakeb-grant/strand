[package]
name = "strand-render"
description = "Render thread: springs, tokens, layout, damage, vello_cpu or GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
strand-scene.workspace = true
strand-text.workspace = true
# Single-threaded f32 pipeline only: no worker threads (vello's filters
# panic multi-threaded), and none of the default png/text extras.
vello_cpu = { version = "0.3", default-features = false, features = ["std", "f32_pipeline"] }

[dev-dependencies]
png = "0.18"
criterion = "0.8"

[lints]
workspace = true

[[bench]]
name = "clock_tick"
harness = false
