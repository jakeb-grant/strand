[package]
name = "strand-surface"
description = "Surface manager: layer-shell, poses, blur, input, frame timing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
strand-scene.workspace = true
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
calloop = "0.14.5"
log = "0.4"
rustix = { version = "1.1.5", features = ["time"] }

[dev-dependencies]
png = "0.18.1"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[lints]
workspace = true
