name: Eval matrix

# The animation evaluation sandbox's long runs (docs/eval.md, "Matrix" and
# "Mutants"): every effect of eval/matrix/effects.toml alone and every
# pair, at 60 and 144 Hz, judged against eval/matrix/known.toml, and the
# mutants (each regression scenario must catch the bug it is named for),
# then their pages in a real browser (scripts/eval/viewer-check.sh).
# Nightly and on demand; ci.yml's `eval` job runs the curated and
# regression scenarios and this matrix, held to its references
# (scripts/eval/ci.sh steps 5 and 6), on every push.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      effects:
        description: Only these effects, comma-separated (empty for all)
        default: ""
      hz:
        description: The rates, comma-separated
        default: "60,144"
      mutants:
        description: Run the mutants too ("true" or "false")
        default: "true"
      repeat:
        description: >-
          Run the scenario gate and the matrix this many times in this job
          and fail on any run that fails or differs from the first
          (scripts/eval/repeat.sh; 1 runs the matrix once, as nightly)
        default: "1"
      report_red:
        description: A red run files the nightly-red issue, as a scheduled one does ("true" or "false")
        default: "false"

# As ci.yml, whatever the repository's default token setting becomes: all
# the matrix uses is the checkout; `nightly-red` alone also writes issues.
permissions:
  contents: read

# As ci.yml: the GPU leg runs on lavapipe and fails without it. The jobs
# run in the CI image, through run.sh; this workflow publishes nothing, so
# on a dispatch from a branch with a new Dockerfile that ci.yml has not
# published yet, run.sh builds it.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  STRAND_REQUIRE_GPU: "1"
  STRAND_GPU_SOFTWARE: "1"
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
  LP_NATIVE_VECTOR_WIDTH: "256"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: eval
          cache-save: "false"
      # Appends its summary.md (the failing and stale cells) to the job's.
      - id: matrix
        run: scripts/container/run.sh env HZ="$HZ" EFFECTS="$EFFECTS" OUT="$OUT" bash scripts/eval/matrix.sh
        if: (inputs.repeat || '1') == '1'
        env:
          HZ: ${{ inputs.hz || '60,144' }}
          EFFECTS: ${{ inputs.effects }}
          OUT: target/eval/matrix-nightly
      # The stability run (docs/eval.md, "Stability"): the gate and the
      # matrix `repeat` times, each held to its references, and every
      # run's trace digests the first run's.
      - id: repeat
        run: scripts/container/run.sh env HZ="$HZ" EFFECTS="$EFFECTS" OUT="$OUT" bash scripts/eval/repeat.sh "$REPEAT"
        if: (inputs.repeat || '1') != '1'
        env:
          REPEAT: ${{ inputs.repeat }}
          HZ: ${{ inputs.hz || '60,144' }}
          EFFECTS: ${{ inputs.effects }}
          OUT: target/eval/repeat
      - id: mutants
        run: scripts/container/run.sh bash scripts/eval/mutants.sh
        if: always() && (inputs.mutants || 'true') == 'true'
      # The viewer in a real browser (docs/eval.md, "The viewer in a
      # browser"): headless Chromium in a pinned Playwright image, no
      # network, every mode of the pages the two steps above wrote (a
      # passing and a failing run, their A/B page, the grid: the nightly
      # matrix's, or the first repeated run's); any console error fails it. Its screenshots go up with the reports.
      - id: viewer
        run: >-
          scripts/eval/viewer-check.sh --expect pass,fail,ab,matrix
          target/eval/mutants/bug25-hidden-text-head
          target/eval/mutants/bug25-hidden-text
          target/eval/mutants/bug25-hidden-text-ab
          ${{ (inputs.repeat || '1') == '1' && 'target/eval/matrix-nightly' || 'target/eval/repeat/1/matrix' }}
        if: always() && (inputs.mutants || 'true') == 'true'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-matrix
          path: |
            target/eval/matrix-nightly/
            target/eval/repeat/
            target/eval/mutants/
            !target/eval/mutants/tree/
            target/eval/viewer-shots/
          if-no-files-found: ignore
      # What a red night's issue quotes: each step's outcome, the failing and stale
      # cells and the mutants not caught, an artifact each so that each is quoted.
      - if: always()
        env:
          MATRIX: ${{ steps.matrix.outcome }}
          REPEAT: ${{ steps.repeat.outcome }}
          MUTANTS: ${{ steps.mutants.outcome }}
          VIEWER: ${{ steps.viewer.outcome }}
        run: |
          mkdir -p target/eval
          printf '### Eval matrix steps\n\n| Step | Outcome |\n|---|---|\n| matrix | %s |\n| repeat | %s |\n| mutants | %s |\n| viewer | %s |\n' \
            "$MATRIX" "$REPEAT" "$MUTANTS" "$VIEWER" >target/eval/steps.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-summary-eval-steps
          path: target/eval/steps.md
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-summary-eval
          path: target/eval/matrix-nightly/summary.md
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-summary-mutants
          path: target/eval/mutants/summary.md
          if-no-files-found: ignore

  # A red night, seen, as in ci.yml: the mutants and the matrix run only here, so
  # they have no push to go red on. The same open issue takes the comment.
  nightly-red:
    needs: matrix
    if: "!cancelled() && (needs.matrix.result == 'failure' || needs.matrix.result == 'cancelled') && (github.event_name == 'schedule' || inputs.report_red == 'true')"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: nightly-summary-*
          path: ${{ runner.temp }}/summaries
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARIES: ${{ runner.temp }}/summaries
        run: >-
          scripts/container/nightly-red.sh
          "eval matrix and mutants: ${{ needs.matrix.result }}"
