[package]
name = "strand-scene"
description = "Shared vocabulary: ids, geometry, colour, damage, the scene protocol and Painter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# (live-examples) `placement` warns of a window's min over its max.
log = "0.4.34"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# (history) The boot clock backlog times are on.
rustix = { version = "1.1.5", features = ["time"] }

# (wasm-spike) A browser's clock (`performance.now()`) in place of
# rustix's clock_gettime (docs/live-examples.md).
[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1.0"

[dev-dependencies]
proptest = "1.11"

[lints]
workspace = true
