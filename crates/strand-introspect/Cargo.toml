[package]
name = "strand-introspect"
description = "D-Bus introspection of an object's properties, for checking no-code `from dbus` services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
log = "0.4.34"
tokio = { version = "1.53", features = ["rt", "sync", "time"] }

[lints]
workspace = true
