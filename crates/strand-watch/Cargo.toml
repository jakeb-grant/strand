[package]
name = "strand-watch"
description = "Change sources: inotify directory watches, polling, portal Settings, compositor-event slot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
# Raw inotify (fs), poll and eventfd (event); see decisions.md, wave2-watch.
rustix = { version = "1.1.5", features = ["fs", "event"] }
tokio = { version = "1.53", features = ["rt", "macros", "sync", "time"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
futures-lite = { version = "2.6", default-features = false, features = ["std"] }

[dev-dependencies]
# Tests build the module set with the real `source::find_files`; the
# runtime boundary is unchanged (the binary passes the set in).
strand-compiler.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.53", features = ["rt-multi-thread"] }

[lints]
workspace = true
