[package]
name = "strand-compiler"
description = "Parser, type checker, bytecode and reconciler for .strand files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["shaders"]
# `check::shaders`: naga parses and validates each `.wgsl` file and
# reflects its `u_*` uniforms (the same naga wgpu links).
shaders = ["dep:naga"]

[dependencies]
strand-core.workspace = true
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"], optional = true }
strand-scene.workspace = true
strand-theme.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.151"
miette = { version = "7.6.0", default-features = false, features = ["fancy-no-backtrace"] }
strsim = "0.11.1"
blake3 = "1.8.7"
stacker = "0.1.25"
similar = "2.7.0"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.11.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
strand-scene.workspace = true
strand-render.workspace = true
strand-text.workspace = true

[lints]
workspace = true
