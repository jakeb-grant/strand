[package]
name = "strand-theme"
description = "Palettes: the Material 3 role schema, material(seed:/image:), importers, gamut mapping and the contrast guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
strand-scene.workspace = true
blake3 = "1.8.7"
# The Material 3 algorithm (HCT, dynamic schemes, Celebi quantiser).
material-colors = { version = "0.5.0", features = ["quantize"] }
# Wallpaper decoding for `material(image:)`.
# WebP wallpapers (no reduced-size decoder exists; capped, see image.rs),
# decoded with image-webp directly, as strand-render does (no `image`
# glue in the binary).
image-webp = "0.2.4"
# JPEG decoded at 1/8 scale (DCT scaling) and PNG decoded row by row,
# so a wallpaper never costs a full-resolution frame.
jpeg-decoder = { version = "0.3.2", default-features = false }
png = "0.18.1"
serde_json = "1.0.151"
log = "0.4"
# `malloc_trim` after a whole-image decode (image.rs).
libc = "0.2.190"

# (wasm-spike) material-colors' ahash seeds its hasher from getrandom
# 0.3, which on wasm32-unknown-unknown needs its `wasm_js` backend
# (plus `--cfg getrandom_backend="wasm_js"`, which scripts/wasm/run.sh
# sets; docs/live-examples.md).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Hand-built interlaced PNGs for the row-by-row decoder's test.
fdeflate = "0.3.7"
crc32fast = "1.5.2"

[lints]
workspace = true
